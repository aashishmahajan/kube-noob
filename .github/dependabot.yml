version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    versioning-strategy: increase-if-necessary   # ranges already admit new releases; requirements.lock pins them
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /plugin/kube-noob
    schedule: {interval: weekly}
    groups:
      plugin:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
