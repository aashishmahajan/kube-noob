name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.lock --require-hashes --disable-pip --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing:skip-covered --cov-fail-under=80
      - name: Build sdist + wheel
        run: python -m build
      - name: Install wheel in a clean venv and smoke-test
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install dist/*.whl
          /tmp/wheelenv/bin/kube-noob --version
          /tmp/wheelenv/bin/kube-noob search "restricted-v2" --format json | python -c "import json,sys; assert json.load(sys.stdin)['results']"
          cd /tmp && /tmp/wheelenv/bin/kube-noob demo all > /tmp/demo.out && grep -q "kube-noob demo: Show and lock" /tmp/demo.out
      - name: MCP stdio end-to-end under the offline lock (installed wheel)
        run: /tmp/wheelenv/bin/python -I scripts/e2e_mcp_offline.py /tmp/wheelenv/bin/kube-noob

  plugin:
    # The Claude plugin runs the bundled server source with dependencies pinned by hash; prove it starts and answers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Plugin server copy matches src
        run: python scripts/sync_plugin_server.py --check
      - name: Plugin lock matches its pyproject
        run: uv lock --check --project plugin/kube-noob --default-index https://pypi.org/simple
      - name: Plugin dependency vulnerability audit
        run: |
          uv export --project plugin/kube-noob --frozen --no-emit-project --format requirements-txt -o /tmp/plugin-requirements.txt
          pip-audit -r /tmp/plugin-requirements.txt --require-hashes --disable-pip --strict
      - name: Plugin MCP server end to end (as .mcp.json runs it)
        run: python scripts/e2e_plugin.py
      - name: Formula matches the PyPI release files
        run: python scripts/brew_formula.py --check

  publishable:
    # Upload validation exactly as pypa/gh-action-pypi-publish runs it: same twine, same Python as its container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: action
        run: echo "python=$(scripts/check_publishable.sh --python-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.action.outputs.python }}
      - run: python -m pip install --upgrade pip build && python -m build
      - run: scripts/check_publishable.sh

  helm-and-dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: pip install -e .
      - name: Lint the kube-noob chart
        run: helm lint --strict deploy/helm/kube-noob --set auth.existingSecret=kn-token
      - name: Audit our own chart (Kubernetes)
        run: |
          helm template kn deploy/helm/kube-noob -n kube-noob --set auth.existingSecret=kn-token \
            --set networkPolicy.allowRouter=false --set networkPolicy.allowIngressNamespace=ingress-nginx \
            | kube-noob audit -f - --platform kubernetes --fail-on medium
      - name: Audit our own chart (OpenShift 4.20, 4.21, 4.22, Route, live cluster tools, EgressFirewall)
        run: |
          set -euo pipefail
          for v in 4.20:1.33.0 4.21:1.34.0 4.22:1.35.0; do
            helm template kn deploy/helm/kube-noob -n kube-noob --kube-version "${v#*:}" \
              --set auth.existingSecret=kn-token --set route.enabled=true --set config.clusterEnabled=true \
              --set config.webEnabled=true --set egressFirewall.enabled=true \
              --set "networkPolicy.egress.apiServerCIDRs={172.30.0.1/32}" \
              | kube-noob audit -f - --platform openshift --version "${v%%:*}" --fail-on medium
          done
      - name: Audit our own Containerfiles; find a credential planted in a real image and deleted by a later layer
        run: |
          set -euo pipefail
          trap 'echo "::error title=image audit::line $LINENO: $BASH_COMMAND"' ERR
          helm template kn deploy/helm/kube-noob --set auth.existingSecret=kn-token > /tmp/kn-chart.yaml
          for f in Containerfile Containerfile.db Containerfile.seed; do
            kube-noob build audit -f "$f" --context . --manifests /tmp/kn-chart.yaml --fail-on high --format text
          done
          work=$(mktemp -d)
          head="-----BEGIN OPEN""SSH PRIVATE KEY-----"
          printf '%s\nb3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQ\n-----END OPENSSH PRIVATE KEY-----\n' "$head" > "$work/id_rsa"
          printf 'FROM registry.access.redhat.com/ubi9/ubi-minimal:latest\nCOPY id_rsa /root/.ssh/id_rsa\nRUN rm /root/.ssh/id_rsa\nUSER 1001\n' > "$work/Containerfile"
          docker build -q -t kn-planted:1 -f "$work/Containerfile" "$work"
          mkdir "$work/layout"
          docker save kn-planted:1 | tar -x -C "$work/layout"
          ls "$work/layout"
          rc=0
          kube-noob build audit -f "$work/Containerfile" --image-layout "$work/layout" --format json > "$work/report.json" || rc=$?
          test "$rc" = 1
          python -c "
          import json, sys
          text = open(sys.argv[1]).read()
          rep = json.loads(text)
          assert 'b3BlbnNzaC1rZXkt' not in text, 'the key body leaked into the report'
          hits = [f for f in rep['findings'] if f['ruleId'] == 'KN-B009']
          planted = [f for f in hits if 'root/.ssh/id_rsa' in f['message']]
          assert planted and 'deleted in layer' in planted[0]['message'], hits
          others = [f['message'] for f in hits if f not in planted]
          print('::notice title=image audit::planted key found in layer', planted[0]['layer'], 'of', rep['image']['layers'],
                '(deleted later);', len(others), 'other layer findings;', rep['image']['files'], 'files read;',
                'not read:', rep['image']['notRead'])
          for m in others[:10]:
              print('::warning title=image audit other finding::' + m[:300])
          " "$work/report.json"
      - name: Chart guards (fail-closed NetworkPolicy, fsGroup only off-OpenShift, web flag wired to env)
        run: |
          set -euo pipefail
          trap 'echo "::error title=chart guard failed::line $LINENO: $BASH_COMMAND"' ERR
          base="--set auth.existingSecret=kn-token"
          if helm template kn deploy/helm/kube-noob $base --set networkPolicy.allowSameNamespace=false \
               --set networkPolicy.allowRouter=false >/dev/null 2>&1; then
            echo "::error title=chart::NetworkPolicy with no allowed source must fail to render"; exit 1
          fi
          if helm template kn deploy/helm/kube-noob $base --set persistence.enabled=true >/dev/null 2>&1; then
            echo "::error title=chart::a ReadWriteOnce PVC with two replicas must fail to render"; exit 1
          fi
          pv="--set persistence.enabled=true --set replicaCount=1"
          helm template kn deploy/helm/kube-noob $base $pv | grep -q "fsGroup: 1001"
          helm template kn deploy/helm/kube-noob $base $pv | grep -q "type: Recreate"
          helm template kn deploy/helm/kube-noob $base $pv | kube-noob audit -f - --platform kubernetes --fail-on high
          if helm template kn deploy/helm/kube-noob $base $pv \
               --api-versions security.openshift.io/v1 | grep -q "fsGroup"; then
            echo "::error title=chart::fsGroup must not be set on OpenShift"; exit 1
          fi
          helm template kn deploy/helm/kube-noob $base --set config.webEnabled=true \
            | grep -A1 "name: KUBE_NOOB_WEB_ENABLED" | grep -q '"true"'
          helm template kn deploy/helm/kube-noob $base --set config.offline=true \
            | grep -A1 "name: KUBE_NOOB_OFFLINE" | grep -q '"true"'
          helm template kn deploy/helm/kube-noob $base --set config.offline=null \
            | grep -A1 "name: KUBE_NOOB_OFFLINE" | grep -q '"false"'
          if helm template kn deploy/helm/kube-noob $base --set config.offline=true --set config.webEnabled=true \
               >/dev/null 2>&1; then
            echo "::error title=chart::offline + webEnabled must fail to render"; exit 1
          fi
          if helm template kn deploy/helm/kube-noob $base --set watch.enabled=true >/dev/null 2>&1; then
            echo "::error title=chart::watch.enabled without config.clusterEnabled must fail to render"; exit 1
          fi
          wt() { helm template kn deploy/helm/kube-noob -n shop $base --set watch.enabled=true \
            --set config.clusterEnabled=true --set "networkPolicy.egress.apiServerCIDRs={172.30.0.1/32}" "$@"; }
          if wt >/dev/null 2>&1; then
            echo "::error title=chart::watch.enabled with two replicas (two ledgers) must fail to render"; exit 1
          fi
          wt --set replicaCount=1 --set "rbac.namespaces={payments}" --show-only templates/configmap.yaml | python -c "
          import sys, yaml
          cfg = yaml.safe_load(yaml.safe_load(sys.stdin)['data']['config.yaml'])
          assert cfg['watch'] == {'enabled': True, 'intervalSeconds': 60, 'namespaces': ['shop', 'payments']}, cfg
          "
          wt --set replicaCount=1 | kube-noob audit -f - --platform openshift --version 4.22 --fail-on high
          if helm template kn deploy/helm/kube-noob $base --set posture.report.enabled=true >/dev/null 2>&1; then
            echo "::error title=chart::posture.report.enabled without config.clusterEnabled must fail to render"; exit 1
          fi
          if wt --set replicaCount=1 --set posture.report.enabled=true >/dev/null 2>&1; then
            echo "::error title=chart::posture.report.enabled without persistence must fail to render"; exit 1
          fi
          wt --set replicaCount=1 --set posture.report.enabled=true --set persistence.enabled=true \
            --set "rbac.namespaces={payments}" --show-only templates/configmap.yaml | python -c "
          import sys, yaml
          cfg = yaml.safe_load(yaml.safe_load(sys.stdin)['data']['config.yaml'])
          assert cfg['posture'] == {'reportEnabled': True, 'keep': 14, 'namespaces': ['shop', 'payments']}, cfg
          "
          if helm template kn deploy/helm/kube-noob $base --set rhacs.enabled=true >/dev/null 2>&1; then
            echo "::error title=chart::rhacs.enabled without rhacs.tokenSecret.name must fail to render"; exit 1
          fi
          if helm template kn deploy/helm/kube-noob $base --set rhacs.enabled=true --set rhacs.tokenSecret.name=rox \
               --set config.offline=true --set rhacs.endpoint=https://central.example.com >/dev/null 2>&1; then
            echo "::error title=chart::config.offline with an external RHACS Central must fail to render"; exit 1
          fi
          rh="--set rhacs.enabled=true --set rhacs.tokenSecret.name=rox --set rhacs.caConfigMap.name=rox-ca"
          helm template kn deploy/helm/kube-noob $base $rh --show-only templates/configmap.yaml | python -c "
          import sys, yaml
          from kube_noob.config import Settings
          cfg = yaml.safe_load(yaml.safe_load(sys.stdin)['data']['config.yaml'])
          assert cfg['rhacs'] == {'enabled': True, 'endpoint': 'https://central.stackrox.svc', 'maxPolicies': 500,
                                  'caFile': '/etc/kube-noob-rhacs-ca/ca.pem'}, cfg
          Settings.model_validate(cfg)
          "
          helm template kn deploy/helm/kube-noob $base $rh | grep -A2 "name: ROX_API_TOKEN" | grep -q 'name: "rox"'
          helm template kn deploy/helm/kube-noob $base $rh --show-only templates/networkpolicy.yaml | grep -q "port: 8443"
          helm template kn deploy/helm/kube-noob $base $rh | kube-noob audit -f - --platform openshift --version 4.22 \
            --fail-on high
          if helm template kn deploy/helm/kube-noob $base --set jira.sync.enabled=true --set replicaCount=1 \
               >/dev/null 2>&1; then
            echo "::error title=chart::jira.sync.enabled without persistence must fail to render"; exit 1
          fi
          jt() { helm template kn deploy/helm/kube-noob $base --set jira.sync.enabled=true \
            --set persistence.enabled=true "$@"; }
          if jt >/dev/null 2>&1; then
            echo "::error title=chart::jira.sync.enabled with two replicas must fail to render"; exit 1
          fi
          if jt --set replicaCount=1 --set config.offline=true >/dev/null 2>&1; then
            echo "::error title=chart::jira.sync.enabled under config.offline must fail to render"; exit 1
          fi
          jt --set replicaCount=1 --set "jira.sync.projects=OCPBUGS\,ROX" --show-only templates/configmap.yaml \
            | python -c "
          import sys, yaml
          from kube_noob.config import Settings
          cfg = yaml.safe_load(yaml.safe_load(sys.stdin)['data']['config.yaml'])
          want = {'syncEnabled': True, 'projects': 'OCPBUGS,ROX', 'intervalHours': 24, 'maxRequests': 600}
          assert cfg['jira'] == want, cfg
          assert Settings.model_validate(cfg).jira.sync_enabled
          "
          jt --set replicaCount=1 --show-only templates/networkpolicy.yaml | grep -q "cidr: 0.0.0.0/0"
          jt --set replicaCount=1 --set egressFirewall.enabled=true --show-only templates/egressfirewall.yaml \
            | grep -q "dnsName: redhat.atlassian.net"
          jt --set replicaCount=1 --api-versions security.openshift.io/v1 \
            | kube-noob audit -f - --platform openshift --version 4.22 --fail-on high
          if helm template kn deploy/helm/kube-noob $base | grep -q -- "-probe\|-dry-run"; then
            echo "::error title=chart::tier Roles must not render by default"; exit 1
          fi
          if helm template kn deploy/helm/kube-noob $base --set probe.enabled=true >/dev/null 2>&1; then
            echo "::error title=chart::probe.enabled without config.clusterEnabled must fail to render"; exit 1
          fi
          if helm template kn deploy/helm/kube-noob $base --set config.offline=true --set itsm.writeEnabled=true \
               >/dev/null 2>&1; then
            echo "::error title=chart::itsm.writeEnabled under config.offline must fail to render"; exit 1
          fi
          if helm template kn deploy/helm/kube-noob $base --set dryRun.enabled=true --set config.clusterEnabled=true \
               --set "networkPolicy.egress.apiServerCIDRs={172.30.0.1/32}" \
               --set "dryRun.rules[0].apiGroups={}" --set "dryRun.rules[0].resources={secrets}" >/dev/null 2>&1; then
            echo "::error title=chart::dry-run rules must never name Secrets"; exit 1
          fi
          tt() { helm template kn deploy/helm/kube-noob -n shop $base --set config.clusterEnabled=true \
            --set "networkPolicy.egress.apiServerCIDRs={172.30.0.1/32}" --set probe.enabled=true \
            --set dryRun.enabled=true --set "rbac.namespaces={payments}" "$@"; }
          tt --show-only templates/rbac-tiers.yaml | python -c "
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          roles = {(d['metadata']['name'], d['metadata']['namespace']) for d in docs if d['kind'] == 'Role'}
          want = {(n, ns) for n in ('kn-kube-noob-probe', 'kn-kube-noob-dry-run') for ns in ('shop', 'payments')}
          assert roles == want, roles
          probe = next(d for d in docs if d['kind'] == 'Role' and d['metadata']['name'].endswith('-probe'))
          assert probe['rules'][0] == {'apiGroups': [''], 'resources': ['pods/ephemeralcontainers'], 'verbs': ['patch']}
          assert not any(d['kind'].startswith('Cluster') for d in docs)
          "
          tt --show-only templates/configmap.yaml | python -c "
          import sys, yaml
          from kube_noob.config import Settings
          from kube_noob import tiers
          cfg = yaml.safe_load(yaml.safe_load(sys.stdin)['data']['config.yaml'])
          on = {t['tier'] for t in tiers.describe(Settings.model_validate(cfg)) if t['enabled']}
          assert on == {'R', 'P', 'D'}, on
          "
          tt --api-versions security.openshift.io/v1 | kube-noob audit -f - --platform openshift --version 4.22 \
            --fail-on high
          mt() { helm template kn deploy/helm/kube-noob -n shop $base "$@"; }
          git="--set memory.source=git --set memory.git.url=https://git.example.com/team/memory.git"
          gimg="--set memory.git.image.repository=quay.io/acme/git --set memory.git.image.tag=2.47.1"
          gcidr="--set memory.git.egressCIDRs={203.0.113.10/32}"
          for args in "--set memory.source=configMap" "--set memory.source=pvc" "--set memory.source=git" \
              "$git" "$git $gimg" "$git $gimg $gcidr --set config.offline=true" \
              "--set memory.source=git --set memory.git.url=ssh://git@git.example.com/team/memory.git $gimg $gcidr"; do
            if mt $args >/dev/null 2>&1; then
              echo "::error title=chart::memory values must fail to render: $args"; exit 1
            fi
          done
          if mt --set memory.source=git --set "memory.git.url=https://u:p@git.example.com/x" $gimg $gcidr \
               >/dev/null 2>&1; then
            echo "::error title=chart::credentials in memory.git.url must be refused by the schema"; exit 1
          fi
          mt --set memory.source=configMap --set memory.configMap.name=team-memory | python -c "
          import sys, yaml
          from kube_noob.config import Settings
          docs = {d['kind']: d for d in yaml.safe_load_all(sys.stdin) if d}
          pod = docs['Deployment']['spec']['template']['spec']
          assert {'name': 'memory', 'configMap': {'name': 'team-memory'}} in pod['volumes'], pod['volumes']
          mounts = pod['containers'][0]['volumeMounts']
          assert {'name': 'memory', 'mountPath': '/srv/kube-noob/memory/entries', 'readOnly': True} in mounts, mounts
          assert 'initContainers' not in pod
          cfg = yaml.safe_load(docs['ConfigMap']['data']['config.yaml'])
          assert cfg['memory'] == {'paths': ['/srv/kube-noob/memory']}, cfg
          assert [str(x) for x in Settings.model_validate(cfg).memory.paths] == ['/srv/kube-noob/memory']
          "
          mt --set memory.source=pvc --set memory.pvc.claimName=team-memory --set memory.pvc.subPath=repo | python -c "
          import sys, yaml
          pod = next(d for d in yaml.safe_load_all(sys.stdin) if d and d['kind'] == 'Deployment')['spec']['template']['spec']
          assert {'name': 'memory', 'persistentVolumeClaim': {'claimName': 'team-memory', 'readOnly': True}} in pod['volumes']
          m = next(v for v in pod['containers'][0]['volumeMounts'] if v['name'] == 'memory')
          assert m == {'name': 'memory', 'mountPath': '/srv/kube-noob/memory', 'readOnly': True, 'subPath': 'repo'}, m
          "
          mt $git $gimg $gcidr --set egressFirewall.enabled=true --set memory.git.ref=release-1 | python -c "
          import sys, yaml
          docs = {d['kind']: d for d in yaml.safe_load_all(sys.stdin) if d}
          pod = docs['Deployment']['spec']['template']['spec']
          init = pod['initContainers'][0]
          assert init['name'] == 'memory-clone' and init['image'] == 'quay.io/acme/git:2.47.1', init
          assert init['command'] == ['git'] and init['args'] == ['clone', '--depth=1', '--branch', 'release-1', '--',
            'https://git.example.com/team/memory.git', '/srv/kube-noob/memory'], init['args']
          assert init['securityContext']['readOnlyRootFilesystem'] is True
          assert {'name': 'memory', 'mountPath': '/srv/kube-noob/memory', 'readOnly': True} in pod['containers'][0]['volumeMounts']
          assert {'name': 'memory', 'emptyDir': {'sizeLimit': '256Mi'}} in pod['volumes']
          egress = docs['NetworkPolicy']['spec']['egress']
          assert {'to': [{'ipBlock': {'cidr': '203.0.113.10/32'}}], 'ports': [{'protocol': 'TCP', 'port': 443}]} in egress, egress
          fw = docs['EgressFirewall']['spec']['egress']
          assert {'type': 'Allow', 'to': {'dnsName': 'git.example.com'}, 'ports': [{'protocol': 'TCP', 'port': 443}]} in fw, fw
          assert fw[-1]['type'] == 'Deny'
          "
          mt --set memory.source=git --set memory.git.url=ssh://git@git.example.com:2222/team/memory.git $gimg $gcidr \
            --set memory.git.sshSecret=memory-deploy-key | python -c "
          import sys, yaml
          docs = {d['kind']: d for d in yaml.safe_load_all(sys.stdin) if d}
          pod = docs['Deployment']['spec']['template']['spec']
          init = pod['initContainers'][0]
          assert init['command'] == ['sh', '-c'] and '\"\$MEMORY_URL\"' in init['args'][0], init
          assert 'StrictHostKeyChecking=yes' in init['args'][0]
          env = {e['name']: e['value'] for e in init['env']}
          assert env['MEMORY_URL'] == 'ssh://git@git.example.com:2222/team/memory.git' and env['MEMORY_REF'] == 'main'
          assert {'name': 'memory-ssh', 'secret': {'secretName': 'memory-deploy-key', 'defaultMode': 288}} in pod['volumes']
          assert pod['securityContext']['fsGroup'] == 1001
          egress = docs['NetworkPolicy']['spec']['egress']
          assert any(r.get('ports') == [{'protocol': 'TCP', 'port': 2222}] for r in egress), egress
          "
          mt --set memory.source=git --set memory.git.url=https://gitea.tools.svc/team/memory.git $gimg $gcidr \
            --set config.offline=true --set egressFirewall.enabled=true --show-only templates/egressfirewall.yaml \
            | python -c "
          import sys, yaml
          fw = yaml.safe_load(sys.stdin)['spec']['egress']
          assert not any('dnsName' in r['to'] for r in fw), fw
          "
          mt $git $gimg $gcidr --api-versions security.openshift.io/v1 \
            | kube-noob audit -f - --platform openshift --version 4.22 --fail-on high
          seed="--set jira.seed.source=image --set jira.seed.image.repository=quay.io/acme/kn-seed"
          for args in "--set jira.seed.source=image" "$seed" "--set jira.seed.source=pvc" "--set jira.seed.source=s3" \
              "$seed --set jira.seed.image.tag=ci1 --set jira.seed.path=/seed/../x.tgz" \
              "$seed --set jira.seed.image.tag=ci1 --set jira.seed.path=/kube-noob-seed/x.tgz" \
              "$seed --set jira.seed.image.tag=ci1 --set jira.seed.sizeLimit=1Ti"; do
            if mt $args >/dev/null 2>&1; then
              echo "::error title=chart::jira.seed values must fail to render: $args"; exit 1
            fi
          done
          mt $seed --set jira.seed.image.tag=2026-10-28 $git $gimg $gcidr | python -c "
          import sys, yaml
          dep = next(d for d in yaml.safe_load_all(sys.stdin) if d and d['kind'] == 'Deployment')
          pod = dep['spec']['template']['spec']
          names = [c['name'] for c in pod['initContainers']]
          assert names == ['jira-seed', 'memory-clone'], names
          init = pod['initContainers'][0]
          assert init['image'] == 'quay.io/acme/kn-seed:2026-10-28', init
          assert init['command'] == ['cp', '--', '/seed/jira-snapshot.tgz', '/kube-noob-seed/jira-snapshot.tgz'], init
          assert init['securityContext']['readOnlyRootFilesystem'] is True, init
          assert init['volumeMounts'] == [{'name': 'jira-seed', 'mountPath': '/kube-noob-seed'}], init
          mounts = pod['containers'][0]['volumeMounts']
          assert {'name': 'jira-seed', 'mountPath': '/var/lib/kube-noob/seed', 'readOnly': True} in mounts, mounts
          assert {'name': 'jira-seed', 'emptyDir': {'sizeLimit': '4Gi'}} in pod['volumes'], pod['volumes']
          assert {'name': 'data', 'emptyDir': {'sizeLimit': '8Gi'}} in pod['volumes'], pod['volumes']
          "
          mt --set jira.seed.source=pvc --set jira.seed.pvc.claimName=jira-main --set jira.seed.pvc.subPath=jira \
            --set persistence.enabled=true --set replicaCount=1 | python -c "
          import sys, yaml
          dep = next(d for d in yaml.safe_load_all(sys.stdin) if d and d['kind'] == 'Deployment')
          pod = dep['spec']['template']['spec']
          assert 'initContainers' not in pod, pod.get('initContainers')
          assert {'name': 'jira-seed', 'persistentVolumeClaim': {'claimName': 'jira-main', 'readOnly': True}} in pod['volumes']
          m = next(v for v in pod['containers'][0]['volumeMounts'] if v['name'] == 'jira-seed')
          assert m == {'name': 'jira-seed', 'mountPath': '/var/lib/kube-noob/seed', 'readOnly': True, 'subPath': 'jira'}, m
          "
          mt $seed --set jira.seed.image.digest=sha256:$(printf '0%.0s' $(seq 64)) --api-versions security.openshift.io/v1 \
            | kube-noob audit -f - --platform openshift --version 4.22 --fail-on high
          if mt | grep -q "jira-seed"; then
            echo "::error title=chart::jira-seed must not render with jira.seed.source none"; exit 1
          fi
          dbd="--set db.image.digest=sha256:$(printf 'a%.0s' $(seq 64))"
          for args in "--set db.enabled=true" "--set db.enabled=true --set db.image.digest=latest" \
              "--set db.enabled=true $dbd --set db.path=/kube-noob-db-seed/x.tgz" \
              "--set db.enabled=true $dbd --set db.path=/db/../x.tgz" "--set db.enabled=true $dbd --set db.image.tag=v1"; do
            if mt $args >/dev/null 2>&1; then
              echo "::error title=chart::db values must fail to render: $args"; exit 1
            fi
          done
          render() { mt "$@" > /tmp/render.yaml 2> /tmp/render.err \
            || { echo "::error title=chart render::$(tr '\n' ' ' < /tmp/render.err | cut -c1-1500)"; return 1; }; }
          render --set db.enabled=true $dbd $seed --set jira.seed.image.tag=ci1
          python scripts/chart_seed_guard.py db < /tmp/render.yaml
          render --set db.enabled=true $dbd
          python scripts/chart_seed_guard.py db-data < /tmp/render.yaml
          sealed="$seed --set jira.seed.image.tag=ci1 --set jira.seed.path=/seed/jira-snapshot.tgz.enc"
          render $sealed --set jira.seed.keySecret.name=kn-seed-key
          python scripts/chart_seed_guard.py sealed < /tmp/render.yaml
          for args in "--set jira.seed.keySecret.name=kn-seed-key" "$sealed --set jira.seed.keySecret.name=Bad_Name" \
              "$sealed --set jira.seed.keySecret.name=k --set jira.seed.keySecret.key=../x" \
              "$sealed --set jira.seed.path=/seed/x.enc"; do
            if mt $args >/dev/null 2>&1; then
              echo "::error title=chart::jira.seed.keySecret values must fail to render: $args"; exit 1
            fi
          done
          mt --set db.enabled=true $dbd --api-versions security.openshift.io/v1 \
            | kube-noob audit -f - --platform openshift --version 4.22 --fail-on high
          if mt | grep -q "kube-noob-db"; then
            echo "::error title=chart::kube-noob-db must not render unless db.enabled"; exit 1
          fi
          helm lint --strict deploy/helm/kube-noob
          helm template kn deploy/helm/kube-noob | grep -q "name: kn-kube-noob-token"
          helm template kn deploy/helm/kube-noob --show-only templates/secret.yaml | grep -q "kind: Secret"
          helm template kn deploy/helm/kube-noob $base | kube-noob audit -f - --platform openshift --version 4.20 --fail-on medium
          if helm template kn deploy/helm/kube-noob $base | grep -q "kind: Secret"; then
            echo "::error title=chart::no Secret may be generated when auth.existingSecret is set"; exit 1
          fi
          if helm template kn deploy/helm/kube-noob --set auth.allowUnauthenticated=true | grep -q "name: KUBE_NOOB_HTTP_TOKEN"; then
            echo "::error title=chart::allowUnauthenticated must not wire a token"; exit 1
          fi
          ef() { helm template kn deploy/helm/kube-noob $base --set egressFirewall.enabled=true "$@"; }
          ef | grep -q "kind: EgressFirewall"
          [ "$(ef | grep -c 'dnsName:')" = 0 ] || { echo "::error title=chart::EgressFirewall allows DNS names without webEnabled"; exit 1; }
          ef --set config.webEnabled=true | python -c "
          import sys, yaml
          fw = [d for d in yaml.safe_load_all(sys.stdin) if d and d['kind'] == 'EgressFirewall']
          assert len(fw) == 1 and fw[0]['metadata']['name'] == 'default', fw
          rules = fw[0]['spec']['egress']
          assert rules[-1] == {'type': 'Deny', 'to': {'cidrSelector': '0.0.0.0/0'}}, rules[-1]
          allow = {'type': 'Allow', 'to': {'dnsName': 'docs.redhat.com'}, 'ports': [{'protocol': 'TCP', 'port': 443}]}
          assert allow in rules, rules
          "
          if ef --set config.offline=true | grep -q "dnsName:"; then
            echo "::error title=chart::offline lock must not allow DNS names"; exit 1
          fi
          if helm template kn deploy/helm/kube-noob $base | grep -q "kind: EgressFirewall"; then
            echo "::error title=chart::EgressFirewall must be opt-in"; exit 1
          fi
          helm template kn deploy/helm/kube-noob $base | grep -A2 "llm:" | grep -q "provider: none"
      - name: Audit the sidecar example
        run: |
          for v in 4.20 4.21 4.22; do
            kube-noob audit -f deploy/sidecar/app-with-kube-noob-sidecar.yaml --platform openshift --version "$v" --fail-on medium
          done
      - name: Generated Helm charts render and audit clean
        run: |
          for p in kubernetes openshift rosa-hcp; do
            expose=route; [ "$p" = kubernetes ] && expose=ingress
            rm -rf /tmp/charts-$p && mkdir -p /tmp/charts-$p
            kube-noob helm-chart --name demo --namespace demo --image ghcr.io/example/demo:1.0.0 \
              --platform $p --expose $expose --host demo.example.com -o /tmp/charts-$p
            helm lint --strict /tmp/charts-$p/demo
            helm template demo /tmp/charts-$p/demo -n demo | kube-noob audit -f - --platform $p --fail-on high
          done

  db-image:
    # The public kube-noob-db image end to end: bundle, gate, image, the chart's cp init container (read-only, no
    # capabilities, user 1001) and the server importing the bundle on start.
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Bundle a small public corpus and gate it
        env:
          KUBE_NOOB_DATA_DIR: /tmp/db-data
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shutil
          from importlib import resources
          from pathlib import Path
          from kube_noob.sources.corpus import write_shard

          data = Path("/tmp/db-data")
          doc = {"sourceId": "k8s-docs", "license": "CC-BY-4.0", "redistributable": True}
          write_shard(data, "k8s-docs", [{**doc, "id": f"k{i}", "title": f"doc {i}", "text": f"Pods {i}"} for i in range(5)])
          write_shard(data, "jira-ocpbugs", [{"id": "j1", "title": "t", "text": "PRIVATE", "sourceId": "jira:OCPBUGS",
                                              "license": "public, not redistributable", "redistributable": False}])
          (data / "known_issues").mkdir()
          src = resources.files("kube_noob").joinpath("data", "known_issues", "openshift-4.21-known-1.json")
          (data / "known_issues" / "openshift-4.21-known-1.json").write_text(src.read_text())
          PY
          mkdir -p dist/kube-noob-db
          kube-noob corpus db-bundle -o dist/kube-noob-db/kube-noob-db.tgz
          tar -xzf dist/kube-noob-db/kube-noob-db.tgz -C dist/kube-noob-db ATTRIBUTION.md
          kube-noob corpus db-check dist/kube-noob-db/kube-noob-db.tgz
          if tar -xzOf dist/kube-noob-db/kube-noob-db.tgz | grep -q PRIVATE; then
            echo "::error title=db::Jira text reached the public bundle"; exit 1; fi
      - name: Live Red Hat VEX (three CVEs, one over the size cap) joins the bundle under CC BY 4.0
        env:
          KUBE_NOOB_DATA_DIR: /tmp/db-data
        run: |
          set -euo pipefail
          kube-noob corpus advisories --online --cves CVE-2023-44487,CVE-2024-21626,CVE-2024-3094 --format json \
            > /tmp/vex.json 2> /tmp/vex.err || { echo "::error title=Red Hat VEX live::$(tr '\n' ' ' < /tmp/vex.err | cut -c1-1500)"; exit 1; }
          curl -s --max-time 120 -o /tmp/vex-raw.json \
            https://security.access.redhat.com/data/csaf/v2/vex/2024/cve-2024-21626.json || true
          python scripts/vex_ci_check.py /tmp/vex.json /tmp/db-data/corpus/redhat-vex.jsonl /tmp/vex-raw.json
          code=$(curl -s -o /dev/null -w '%{http_code}' https://security.access.redhat.com/data/csaf/v2/vex/archive_latest.txt)
          echo "::notice title=VEX archive pointer::archive_latest.txt HTTP $code"
          kube-noob corpus db-bundle -o dist/kube-noob-db/kube-noob-db.tgz
          kube-noob corpus db-check dist/kube-noob-db/kube-noob-db.tgz
          tar -xzf dist/kube-noob-db/kube-noob-db.tgz -C dist/kube-noob-db ATTRIBUTION.md
          grep -q "Red Hat Security Data" dist/kube-noob-db/ATTRIBUTION.md
      - name: Build both images
        run: |
          docker build -f Containerfile.db -t kube-noob-db:ci .
          docker build -f Containerfile -t kube-noob:ci .
          [ "$(docker image inspect kube-noob-db:ci --format '{{.Config.User}}')" = "1001" ]
      - name: The init container copies the archive and the server imports it on start
        run: |
          set -euo pipefail
          docker volume create kn-db-seed
          # an emptyDir is group-writable for the pod's group 0; a fresh docker volume is root-only until set so
          docker run --rm -v kn-db-seed:/kube-noob-db-seed --user 0 kube-noob-db:ci chmod 0770 /kube-noob-db-seed
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --user 1001:0 \
            -v kn-db-seed:/kube-noob-db-seed kube-noob-db:ci \
            cp -- /kube-noob-db/kube-noob-db.tgz /kube-noob-db-seed/kube-noob-db.tgz
          docker run -d --name kn -e KUBE_NOOB_HTTP_TOKEN=ci-token -p 18080:8080 \
            -v kn-db-seed:/var/lib/kube-noob/seed-db:ro kube-noob:ci
          for _ in $(seq 60); do curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1 && break; sleep 1; done
          docker logs kn 2>&1 | tee /tmp/kn.log
          grep -q "kube-noob-db imported from /var/lib/kube-noob/seed-db/kube-noob-db.tgz" /tmp/kn.log
          docker exec kn kube-noob corpus stats --format json > /tmp/stats.json
          docker exec kn cat /var/lib/kube-noob/corpus/DB_SEED.json
          python -c "
          import json
          s = json.load(open('/tmp/stats.json'))
          assert 'k8s-docs' in json.dumps(s) and 'jira' not in json.dumps(s['manifest']['shards']), s
          "
          docker rm -f kn

  e2e-kind:
    # One leg per supported OpenShift minor (by its Kubernetes version) plus the newest Kubernetes kind ships.
    name: e2e-kind (OpenShift ${{ matrix.ocp }}, Kubernetes ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ocp: "4.20", k8s: "1.33", kind: v0.32.0, kubectl: v1.33.12,
             node: "kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4"}
          - {ocp: "4.21", k8s: "1.34", kind: v0.33.0, kubectl: v1.34.11,
             node: "kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d"}
          - {ocp: "4.22", k8s: "1.35", kind: v0.33.0, kubectl: v1.35.8,
             node: "kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0"}
          - {ocp: "next", k8s: "1.37", kind: v0.33.0, kubectl: v1.37.1,
             node: "kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: kn
          version: ${{ matrix.kind }}
          node_image: ${{ matrix.node }}
          kubectl_version: ${{ matrix.kubectl }}
      - run: pip install -e .
      - name: Server-side dry-run of generated manifests
        run: |
          set -o pipefail
          dry() { kubectl apply --dry-run=server -f "$1" 2>&1 | tee /tmp/dry.out || { sed 's/^/::error title=dry-run::/' /tmp/dry.out; exit 1; }; }
          kubectl create namespace demo
          kube-noob generate --name web --namespace demo --image nginxinc/nginx-unprivileged:1.27.2 \
            --replicas 2 --expose ingress --host web.example.com -o /tmp/gen.yaml
          dry /tmp/gen.yaml
          kube-noob generate --name db --namespace demo --image registry.example.com/db:1.0.0 --workload statefulset \
            --storage-size 1Gi -o /tmp/sts.yaml
          dry /tmp/sts.yaml
      - name: Legacy (removed-API) bundle is migrated by `kube-noob fix` and accepted server-side
        run: |
          set -o pipefail
          kubectl create namespace shop
          if kubectl apply --dry-run=server -f tests/fixtures/legacy-bundle.yaml > /tmp/legacy.out 2>&1; then
            echo "::error::legacy bundle unexpectedly applied before migration"; exit 1; fi
          kube-noob fix -f tests/fixtures/legacy-bundle.yaml --platform kubernetes --version 1.35 -o /tmp/migrated.yaml
          kubectl apply --dry-run=server -f /tmp/migrated.yaml 2>&1 | tee /tmp/migrated.out \
            || { sed 's/^/::error title=migrated dry-run::/' /tmp/migrated.out; exit 1; }
      - name: Build image and load into kind
        run: |
          docker build -f Containerfile -t kube-noob:ci .
          kind load docker-image kube-noob:ci --name kn
      - name: The image answers from a local Red Hat Jira copy (SQLite FTS5 present)
        run: |
          set -euo pipefail
          mkdir -p /tmp/kn-tickets
          python - <<'PY'
          from pathlib import Path
          from kube_noob.sources.corpus import write_shard

          base = {"sourceId": "jira:OCPBUGS", "license": "public, not redistributable", "redistributable": False,
                  "issueType": "Bug", "status": "Closed", "retrievedAt": "2026-10-28T00:00:00Z"}
          recs = [{**base, "id": f"jira-OCPBUGS-{i}", "title": f"OCPBUGS-{i}: pod restarts {i}",
                   "text": f"Pod restarts in namespace team{i}", "resolution": "Done", "fixVersions": ["4.20.0"]}
                  for i in range(1, 80)]
          recs.append({**base, "id": "jira-OCPBUGS-900", "title": "OCPBUGS-900: router cannot load its certificate",
                       "text": "## Description\n\nhaproxy: unable to load default certificate file\n\n## Comments\n\n"
                               "Comment (2026-07-01): This is expected behavior: the secret was malformed.",
                       "resolution": "Not a Bug"})
          write_shard(Path("/tmp/kn-tickets"), "jira-ocpbugs", recs)
          PY
          chmod -R a+rwX /tmp/kn-tickets
          docker run --rm -e KUBE_NOOB_DATA_DIR=/data -v /tmp/kn-tickets:/data kube-noob:ci \
            known-issues "router: unable to load default certificate file" --platform openshift --format json \
            > /tmp/ki.json
          python -c "
          import json
          k = json.load(open('/tmp/ki.json'))
          top = k['matches'][0]
          assert top['id'] == 'OCPBUGS-900' and top['verdict'] == 'not-a-bug' and top['exactError'], top
          assert k['knowledge']['jiraTickets']['tickets'] == 80, k['knowledge']
          print('::notice title=Image ticket index::' + top['status'])
          "
      - name: Install chart with read-only cluster tools
        run: |
          kubectl create namespace kube-noob
          kubectl -n kube-noob create secret generic kn-token --from-literal=token=ci-token
          EP=$(kubectl get endpoints kubernetes -o jsonpath='{.subsets[0].addresses[0].ip}')
          SVC=$(kubectl get svc kubernetes -o jsonpath='{.spec.clusterIP}')
          helm install kn deploy/helm/kube-noob -n kube-noob \
            --set image.repository=kube-noob --set image.tag=ci --set image.pullPolicy=Never \
            --set auth.existingSecret=kn-token --set config.clusterEnabled=true --set "rbac.namespaces={demo}" \
            --set config.defaultPlatform=kubernetes --set networkPolicy.allowRouter=false \
            --set networkPolicy.egress.dnsNamespace=kube-system --set networkPolicy.egress.dnsPort=53 \
            --set "networkPolicy.egress.apiServerCIDRs={${EP}/32,${SVC}/32}" --wait --timeout 4m \
            || { kubectl -n kube-noob get events --sort-by=.lastTimestamp | tail -30 | sed 's/^/::error title=install::/'; exit 1; }
      - name: Helm test (in-cluster readiness through the Service)
        run: helm test kn -n kube-noob --timeout 3m --logs
      - name: Sealed private Jira seed, wrong key, sync on and off (requirements R1.4, R1.5)
        if: matrix.ocp == '4.22'
        run: bash scripts/e2e_jira_seed_kind.sh kube-noob:ci kn
      - name: Sidecar under Pod Security restricted (loopback only, transcript)
        run: scripts/demo_sidecar_kind.sh kube-noob:ci "/tmp/sidecar-transcript-${{ matrix.ocp }}.txt"
      - name: Publish the sidecar transcript as an annotation (source of the sidecar demo video)
        if: matrix.ocp == '4.22'
        run: echo "::notice title=sidecar transcript::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' /tmp/sidecar-transcript-4.22.txt)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sidecar-transcript-${{ matrix.ocp }}
          path: /tmp/sidecar-transcript-${{ matrix.ocp }}.txt
          if-no-files-found: ignore
      - name: Deploy a crashing workload to debug
        run: |
          kubectl -n demo create deployment crasher --image=busybox:1.36 -- sh -c 'echo starting; echo password=hunter2; exit 3'
          kubectl -n demo create secret generic do-not-read --from-literal=k=v
          sleep 45
          kubectl -n demo get pods
      - name: Incident watch finds and explains the crash loop and a Pod Security denial (read-only)
        run: |
          set -euo pipefail
          kubectl create namespace strict
          kubectl label namespace strict pod-security.kubernetes.io/enforce=restricted
          kubectl -n strict create deployment rooty --image=busybox:1.36 -- sleep 3600
          sleep 20
          export KUBE_NOOB_DATA_DIR=/tmp/kn-watch
          kube-noob --cluster-enabled --format json watch -n demo -n strict --once > /tmp/watch.json
          python - <<'PY'
          import json
          out = json.load(open("/tmp/watch.json"))
          rows = {(r["workload"], r["signal"]): r for r in out["open"]}
          assert out["errors"] == [], out["errors"]
          crash = rows.get(("deployment/crasher", "CrashLoopBackOff"))
          assert crash and crash["diagnosis"] == "DBG-CRASHLOOP", rows
          denied = rows.get(("deployment/rooty", "FailedCreate"))
          assert denied and "Pod Security" in denied["headline"], rows
          ledger = open("/tmp/kn-watch/incidents.json").read()
          assert "hunter2" not in ledger, "a secret from the crashing container's output reached the ledger"
          print(json.dumps(sorted(rows), indent=1))
          PY
          kube-noob incidents
      - name: MCP end-to-end over HTTP
        run: |
          kubectl -n kube-noob port-forward svc/kn-kube-noob 18080:8080 &
          sleep 5
          set -o pipefail
          python scripts/e2e_mcp_http.py --url http://127.0.0.1:18080/mcp --token ci-token \
            --cluster-namespace demo --cluster-deployment crasher 2>&1 | tee /tmp/e2e.out \
            || { echo "::error title=e2e::$(tail -60 /tmp/e2e.out | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          echo "::warning title=describe::$(kubectl -n kube-noob describe pods 2>&1 | tail -60 | enc)" || true
          echo "::warning title=logs::$(kubectl -n kube-noob logs deploy/kn-kube-noob --tail=80 2>&1 | enc)" || true

  gate-ci:
    # R4.3: the gate passes this repository's chart and fails on fixtures, as a GitHub Action, a Tekton Task (in
    # kind) and a GitLab CI template (run by gitlab-ci-local).
    runs-on: ubuntu-latest
    needs: [test]
    env:
      TEKTON_VERSION: v1.15.5
      # release.yaml of that version; empty until a run of this job has read it (the step prints it), then pinned
      TEKTON_SHA256: "c2fe5c2ac98af2984f2d58199e81ef2056802f671051744d986ec998ad19ba84"
      GITLAB_CI_LOCAL: gitlab-ci-local@4.76.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Values for rendering our chart
        run: |
          printf 'auth:\n  existingSecret: kn-token\n' > /tmp/kn-values.yaml
      - id: good
        name: GitHub Action on our own chart (must pass)
        uses: ./
        with:
          chart: deploy/helm/kube-noob
          values: /tmp/kn-values.yaml
          namespace: kube-noob
          containerfiles: Containerfile
          platform: openshift
          version: "4.20"
          sarif: /tmp/kn-good.sarif
      - id: bad
        name: GitHub Action on the bad fixtures (must fail)
        continue-on-error: true
        uses: ./
        with:
          paths: tests/fixtures/gate/bad
          containerfiles: tests/fixtures/containerfile/KN-B005.bad.Containerfile
          platform: openshift
          version: "4.20"
          sarif: /tmp/kn-bad.sarif
      - name: The action's verdicts and SARIF 2.1.0 schema
        env:
          GOOD: ${{ steps.good.outputs.result }}
          BAD: ${{ steps.bad.outputs.result }}
        run: |
          set -euo pipefail
          test "$GOOD" = passed || { echo "::error title=gate action::our chart: $GOOD"; exit 1; }
          test "$BAD" = failed || { echo "::error title=gate action::bad fixtures: $BAD"; exit 1; }
          python -m pip install --quiet check-jsonschema==0.38.2
          check-jsonschema --schemafile https://json.schemastore.org/sarif-2.1.0.json /tmp/kn-good.sarif /tmp/kn-bad.sarif
          python -c "
          import json
          bad = json.load(open('/tmp/kn-bad.sarif'))['runs'][0]['results']
          print('::notice title=gate action::our chart passed; bad fixtures failed with', len(bad), 'SARIF results')
          "
      - name: Build the image the Tekton Task and the GitLab template run
        run: |
          docker build -f Containerfile -t kube-noob:ci .
          docker tag kube-noob:ci "ghcr.io/aashishmahajan/kube-noob:$(python -c 'import re;print(re.search(r"__version__ = \"([^\"]+)\"", open("src/kube_noob/__init__.py").read()).group(1))')"
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: kn
          version: v0.32.0
          node_image: "kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4"
          kubectl_version: v1.33.12
      - name: Install Tekton Pipelines
        run: |
          set -euo pipefail
          url="https://github.com/tektoncd/pipeline/releases/download/${TEKTON_VERSION}/release.yaml"
          curl -fsSL --retry 3 -o /tmp/tekton.yaml "$url"
          got=$(sha256sum /tmp/tekton.yaml | cut -d' ' -f1)
          if [ "$got" != "$TEKTON_SHA256" ]; then
            echo "::error title=Tekton release.yaml::sha256 ${got} differs from the pinned ${TEKTON_SHA256}"; exit 1
          fi
          kubectl apply -f /tmp/tekton.yaml > /tmp/tekton.out 2>&1 \
            || { echo "::error title=Tekton install::$(tail -c 1500 /tmp/tekton.out | tr '\n' ' ')"; exit 1; }
          kubectl -n tekton-pipelines rollout status deploy/tekton-pipelines-controller --timeout=300s
          kubectl -n tekton-pipelines rollout status deploy/tekton-pipelines-webhook --timeout=300s
          kind load docker-image kube-noob:ci --name kn
      - name: Tekton Task on our chart (must pass) and on the bad fixtures (must fail)
        run: |
          set -euo pipefail
          kubectl apply -f deploy/tekton/kube-noob-gate.yaml
          helm template kn deploy/helm/kube-noob -n kube-noob -f /tmp/kn-values.yaml > /tmp/kn-chart.yaml
          kubectl create configmap gate-good --from-file=chart.yaml=/tmp/kn-chart.yaml --from-file=Containerfile=Containerfile
          kubectl create configmap gate-bad --from-file=tests/fixtures/gate/bad/ \
            --from-file=Containerfile=tests/fixtures/containerfile/KN-B005.bad.Containerfile
          for case in good bad; do
            cat <<EOF | kubectl create -f -
          apiVersion: tekton.dev/v1
          kind: TaskRun
          metadata: {name: gate-${case}}
          spec:
            taskRef: {name: kube-noob-gate}
            params:
              - {name: image, value: kube-noob:ci}
              - {name: paths, value: "."}
              - {name: containerfiles, value: Containerfile}
              - {name: platform, value: openshift}
              - {name: version, value: "4.20"}
            workspaces:
              - {name: source, configMap: {name: gate-${case}}}
          EOF
          done
          for case in good bad; do
            kubectl wait "taskrun/gate-${case}" --for=condition=Succeeded=Unknown --timeout=5s >/dev/null 2>&1 || true
            for i in $(seq 1 90); do
              s=$(kubectl get "taskrun/gate-${case}" -o jsonpath='{.status.conditions[0].status}')
              [ "$s" = True ] || [ "$s" = False ] && break
              sleep 5
            done
          done
          good=$(kubectl get taskrun/gate-good -o jsonpath='{.status.results[?(@.name=="result")].value}')
          bad=$(kubectl get taskrun/gate-bad -o jsonpath='{.status.results[?(@.name=="result")].value}')
          counts=$(kubectl get taskrun/gate-bad -o jsonpath='{.status.results[?(@.name=="counts")].value}')
          echo "::notice title=Tekton gate::good=${good} bad=${bad} counts=${counts}"
          test "$good" = passed && test "$bad" = failed \
            || { kubectl get taskrun -o yaml | tail -80 | sed 's/^/::warning title=taskrun::/'; exit 1; }
      - name: GitLab CI template under gitlab-ci-local (must pass on the chart, fail on the fixtures)
        run: |
          set -euo pipefail
          cp /tmp/kn-chart.yaml rendered-chart.yaml
          cat > .gitlab-ci-gate.yml <<'EOF'
          include:
            - local: deploy/gitlab/kube-noob-gate.gitlab-ci.yml
          gate-good:
            extends: .kube-noob-gate
            variables: {KUBE_NOOB_PATHS: rendered-chart.yaml, KUBE_NOOB_CONTAINERFILES: Containerfile, KUBE_NOOB_PLATFORM: openshift, KUBE_NOOB_VERSION: "4.20"}
          gate-bad:
            extends: .kube-noob-gate
            variables: {KUBE_NOOB_PATHS: tests/fixtures/gate/bad, KUBE_NOOB_CONTAINERFILES: tests/fixtures/containerfile/KN-B005.bad.Containerfile, KUBE_NOOB_PLATFORM: openshift, KUBE_NOOB_VERSION: "4.20"}
          EOF
          git add -f rendered-chart.yaml .gitlab-ci-gate.yml  # in the index only, in case untracked files are not copied
          npx --yes "$GITLAB_CI_LOCAL" --file .gitlab-ci-gate.yml gate-good > /tmp/gl-good.out 2>&1 \
            || { tail -c 2000 /tmp/gl-good.out | tr '\n' ' ' | sed 's/^/::error title=gitlab good::/'; exit 1; }
          rc=0
          npx --yes "$GITLAB_CI_LOCAL" --file .gitlab-ci-gate.yml gate-bad > /tmp/gl-bad.out 2>&1 || rc=$?
          test "$rc" != 0 || { echo "::error title=gitlab bad::the bad fixtures passed"; exit 1; }
          grep -q "kube-noob gate failed" /tmp/gl-bad.out \
            || { tail -c 2000 /tmp/gl-bad.out | tr '\n' ' ' | sed 's/^/::error title=gitlab bad output::/'; exit 1; }
          echo "::notice title=GitLab gate::chart passed, fixtures failed (exit ${rc})"

  policy-kind:
    # R3.1 acceptance: each generated admission policy refuses its rule's bad fixture and admits the good one on a real
    # API server (server-side dry-run), for the built-in ValidatingAdmissionPolicy and for Kyverno ValidatingPolicy.
    name: policy-kind (${{ matrix.engine }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        engine: [vap, kyverno]
    env:
      KYVERNO_VERSION: v1.19.1
      # install.yaml of that release, first read by run 40646897729 (GitHub's runner) and pinned here
      KYVERNO_SHA256: d3322cb346d3d42dd0f41e230b0d1d7bc5619960e1c36fdac4d9151d724b88e6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: kn
          version: v0.32.0
          node_image: "kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4"
          kubectl_version: v1.33.12
      - run: pip install -e .
      - name: Install Kyverno
        if: matrix.engine == 'kyverno'
        run: |
          set -euo pipefail
          url="https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/install.yaml"
          curl -fsSL --retry 3 -o /tmp/kyverno-install.yaml "$url"
          echo "${KYVERNO_SHA256}  /tmp/kyverno-install.yaml" | sha256sum -c - \
            || { echo "::error title=Kyverno install.yaml::sha256 differs from the pinned ${KYVERNO_SHA256}"; exit 1; }
          kubectl create -f /tmp/kyverno-install.yaml > /tmp/kyverno.out 2>&1 \
            || { echo "::error title=Kyverno install::$(tail -c 1500 /tmp/kyverno.out | tr '\n' ' ')"; exit 1; }
          kubectl -n kyverno rollout status deploy/kyverno-admission-controller --timeout=300s
          kubectl get crd validatingpolicies.policies.kyverno.io
      - name: Generated policies on the API server
        run: python scripts/policy_kind_test.py --engine ${{ matrix.engine }}
      - name: Attack-path scan ranks the planted path first, reading no Secrets (R3.2)
        if: matrix.engine == 'vap'
        run: python scripts/posture_kind_test.py
      - name: Diagnostics on failure
        if: failure()
        run: |
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          echo "::warning title=pods::$(kubectl get pods -A 2>&1 | tail -40 | enc)" || true
          echo "::warning title=kyverno logs::$(kubectl -n kyverno logs deploy/kyverno-admission-controller --tail=60 2>&1 | enc)" || true
