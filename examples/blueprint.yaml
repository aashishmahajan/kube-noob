# Describe the app; kube-noob generates audited manifests for the platform.
# Try: kube-noob protocol "Deploy orders-api on ROSA HCP" --blueprint examples/blueprint.yaml
name: orders-api
namespace: shop
image: quay.io/example/orders-api@sha256:4f2c8a1d9b7e6c5a3f0e1d2c4b6a8e0f1a3c5e7d9b2f4a6c8e0d1f3a5c7e9b1d
platform: rosa-hcp
platformVersion: "4.22"
replicas: 3
port: 8080
exposure:
  type: route
  host: orders.apps.example.com
resources:
  cpuRequest: 100m
  memoryRequest: 256Mi
  memoryLimit: 512Mi
secretEnv:
  DB_PASSWORD: orders-db/password
egress: dns-only
hpaMaxReplicas: 6
