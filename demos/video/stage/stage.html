<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kube-noob video stage</title>
<!--
  A 1920x1080 animated stage in the look of the Grok teaser: a navy server room, a glowing glass terminal, floating
  cubes and the rocket mascot. Every frame is a pure function of time: capture.js calls renderAt(t) and screenshots.
  Scenes, captions and timing come from timeline.json (voiceover.py); terminal lines are copied from real runs.
-->
<style>
:root {
  /* --sans, --mono and the --kn-* colours come from docs/brand via demos/video/brand.js */
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--kn-navy-night); }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--sans); color: var(--kn-ink); }
.layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
#world { transform-origin: 960px 540px; }

/* room */
#room { background: radial-gradient(ellipse 1300px 820px at 50% 40%, #17325e 0%, #0c1a35 50%, #060d1c 100%); will-change: opacity; }
#wall { position: absolute; left: 0; top: 0; width: 1920px; height: 660px;
  background: repeating-linear-gradient(90deg, rgba(140,180,255,.04) 0 2px, transparent 2px 240px),
              linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.28)); }
#floor { position: absolute; left: -1200px; top: 640px; width: 4320px; height: 1500px; transform-origin: 50% 0;
  transform: perspective(700px) rotateX(74deg);
  background-image: linear-gradient(rgba(130,180,255,.15) 2px, transparent 2px),
                    linear-gradient(90deg, rgba(130,180,255,.15) 2px, transparent 2px);
  background-size: 180px 180px;
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,.85) 25%, #000 100%); }
#floorGlow { position: absolute; left: 360px; top: 690px; width: 1200px; height: 330px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(var(--moodc), .34), transparent); }
.rack { position: absolute; top: 170px; width: 190px; height: 660px; border-radius: 8px;
  background: linear-gradient(90deg, #0a1428, #10203e); border: 1px solid rgba(120,160,230,.14); }
.rack::after { content: ""; position: absolute; inset: 18px; opacity: var(--led, .35); will-change: opacity;
  background: radial-gradient(circle, rgba(var(--kn-green-rgb), .85) 0 2.5px, transparent 3.5px) 0 0 / 36px 28px; }
#rackL { left: 30px; transform: perspective(900px) rotateY(40deg); }
#rackR { right: 30px; transform: perspective(900px) rotateY(-40deg); }
#tint { background: radial-gradient(ellipse 1100px 700px at 50% 45%, rgba(239,68,68,.55), rgba(127,29,29,.25) 60%, transparent 100%); mix-blend-mode: screen; }
#vignette { background: radial-gradient(ellipse 1250px 760px at 50% 50%, transparent 55%, rgba(0,0,0,.6) 100%); pointer-events: none; }
#black { background: #000; z-index: 40; }

/* cubes */
#cubes { perspective: 1400px; perspective-origin: 960px 470px; }
.cube { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.cube > i { position: absolute; background: rgba(var(--c), var(--fa, .17)); border: 1.5px solid rgba(var(--c), .62);
  box-shadow: inset 0 0 18px rgba(var(--c), .35); }
.puff { position: absolute; left: 0; top: 0; width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 50%;
  background: radial-gradient(circle, rgba(214,222,234,.9) 0%, rgba(170,184,204,.55) 38%, transparent 70%); }
.shard { position: absolute; left: 0; top: 0; width: 12px; height: 12px; background: rgba(226,232,240,.8); border-radius: 2px; }

/* glass terminal */
.term { position: absolute; z-index: 10; border-radius: 22px; border: 2px solid rgba(var(--tc), .78); overflow: hidden;
  background: linear-gradient(160deg, rgba(var(--tc), .16), rgba(8,22,40,.80) 42%, rgba(6,16,32,.90));
  box-shadow: 0 0 70px rgba(var(--tc), .30), inset 0 0 90px rgba(var(--tc), .10), 0 30px 90px rgba(0,0,0,.5); }
.term .hd { height: 46px; display: flex; align-items: center; padding: 0 22px; gap: 11px; border-bottom: 1px solid rgba(var(--tc), .26); }
.term .hd i { width: 14px; height: 14px; border-radius: 50%; display: block; }
.term .hd .t { margin-left: 16px; font: 500 17px var(--mono); color: rgba(var(--tx), .6); }
.term .hd .r { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.term .hd .r b { width: 8px; height: 8px; border-radius: 50%; background: rgba(var(--tx), .35); display: block; }
.term .bd { position: absolute; left: 34px; right: 34px; top: 66px; bottom: 26px; overflow: hidden; }
.term .sc { position: absolute; left: 0; right: 0; top: 0; font: 400 var(--fs, 22px)/1.5 var(--mono); color: rgb(var(--tx)); will-change: transform; }
.term .ln { white-space: pre-wrap; overflow-wrap: anywhere; padding-left: 2ch; text-indent: -2ch; min-height: 1.5em; }
.term .bars i { display: block; height: 13px; border-radius: 7px; margin: 0 0 22px; background: rgba(var(--tc), .62);
  box-shadow: 0 0 14px rgba(var(--tc), .35); }
.cur { display: inline-block; width: .6em; height: 1.05em; vertical-align: -.17em; background: rgb(var(--tc)); margin-left: 2px; }
.tp { color: var(--kn-green); } .tc { color: var(--kn-ink); } .th { color: var(--kn-danger); font-weight: 700; } .tm { color: var(--kn-warning); }
.tk { color: var(--kn-muted); } .tn { color: var(--kn-warning); } .tb { color: var(--kn-green); } .tg { color: var(--kn-green-soft); } .tr { color: var(--kn-danger-soft); }

/* caption */
/* stacking: terminal 10 < caption 20 < end card 30 < black fade 40, so no window ever covers a caption */
#caption { position: absolute; z-index: 20; left: 0; width: 1920px; text-align: center; color: var(--kn-ink); font-weight: 650;
  letter-spacing: -0.012em; text-shadow: 0 2px 6px rgba(0,0,0,.55), 0 0 34px rgba(0,0,0,.6); }
#caption.center { top: 600px; font-size: 66px; line-height: 1.12; transform: translateY(-50%); }
#caption.top { top: 54px; font-size: 54px; }
#caption.lower { bottom: 44px; font-size: 40px; }
#caption.lower span { display: inline-block; padding: 14px 34px; border-radius: 18px; background: rgba(5,12,26,.78);
  border: 1px solid rgba(255,255,255,.09); text-shadow: none; }
#caption.mono span { font: 500 34px var(--mono); color: var(--kn-green-soft); }

/* chat icon, beam, rocket */
.chat, .rk, .clipb { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.rk svg, .chat svg { overflow: visible; display: block; }
#fx { position: absolute; left: 0; top: 0; }

/* iso world (sidecar) */
#iso { perspective: 2600px; perspective-origin: 960px 380px; }
.isoCam { position: absolute; left: 960px; top: 650px; transform-style: preserve-3d; }
.isoWorld { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.box, .bb, .flat { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.face { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.pod .face { background: rgba(45,212,191,.075); border: 2px solid rgba(94,234,212,.62); box-shadow: inset 0 0 42px rgba(45,212,191,.13); }
.pod .top { background: rgba(45,212,191,.02); }
.pod .bottom { background: rgba(8,40,60,.55); }
.ctr-app .face { background: rgba(26,56,112,.94); border: 2px solid rgba(125,211,252,.85); }
.ctr-app .top { background: rgba(48,92,170,.96); }
.ctr-kn .face { background: rgba(14,62,54,.94); border: 2px solid rgba(var(--kn-green-rgb), .9); }
.ctr-kn .top { background: rgba(24,104,86,.96); }
.shield .face { background: rgba(94,234,212,.035); border: 2px dashed rgba(94,234,212,.32); }
.shield .top, .shield .bottom { display: none; }
.mini .face { background: rgba(var(--kn-danger-rgb), .38); border: 1.5px solid rgba(var(--kn-danger-soft-rgb), .85); }
.door { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #0b1a33; border: 3px solid var(--kn-warning); border-radius: 6px 6px 0 0; }
.isoFloor { position: absolute; left: 0; top: 0; width: 5200px; height: 5200px; transform-origin: 0 0;
  background-image: linear-gradient(rgba(94,234,212,.12) 2px, transparent 2px), linear-gradient(90deg, rgba(94,234,212,.12) 2px, transparent 2px);
  background-size: 160px 160px; -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, rgba(0,0,0,.6) 30%, transparent 62%); }
.bbIn { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; }
.label { font: 600 30px var(--sans); color: var(--kn-ink); padding: 8px 18px; border-radius: 12px; background: rgba(5,12,26,.94);
  border: 1px solid rgba(255,255,255,.12); display: inline-block; }
.label.mono { font: 500 26px var(--mono); color: var(--kn-green-soft); }
.flash { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(240,253,250,.95), rgba(94,234,212,.5) 35%, transparent 70%); }

/* desk (mcp) */
#desk .lamp { position: absolute; left: -200px; top: -260px; width: 1300px; height: 1100px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(var(--kn-warning-rgb), .22), rgba(var(--kn-warning-rgb), .06) 55%, transparent); }
#desk .top { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  clip-path: polygon(0 1080px, 1920px 1080px, 1700px 690px, 220px 690px);
  background: linear-gradient(180deg, #34507c, #1c2c48 45%, #0f192d); }
#desk .edge { position: absolute; left: 220px; top: 687px; width: 1480px; height: 4px; background: linear-gradient(90deg, transparent, rgba(170,205,255,.55), transparent); }
.laptop { position: absolute; left: 610px; top: 300px; width: 700px; height: 500px; }
.laptop .scr { position: absolute; left: 20px; top: 0; width: 660px; height: 410px; border-radius: 18px; background: #1b2638;
  border: 2px solid #334462; box-shadow: 0 0 80px rgba(96,165,250,.25); }
.laptop .in { position: absolute; left: 16px; top: 16px; right: 16px; bottom: 16px; border-radius: 8px; overflow: hidden;
  background: linear-gradient(170deg, #0d1b33, #08111f); }
.laptop .in i { position: absolute; height: 10px; border-radius: 5px; }
.laptop .base { position: absolute; left: -60px; top: 410px; width: 820px; height: 54px;
  clip-path: polygon(70px 0, 750px 0, 820px 54px, 0 54px); background: linear-gradient(180deg, #8ca0bd, #55667f); }
.laptop .pad { position: absolute; left: 300px; top: 420px; width: 160px; height: 14px; border-radius: 6px; background: rgba(15,23,42,.35); }
.speech { position: absolute; border-radius: 28px; background: rgba(241,246,255,.95); color: #0b1630; box-shadow: 0 24px 70px rgba(0,0,0,.45), 0 0 0 2px rgba(147,197,253,.6); }
.speech::after { content: ""; position: absolute; left: 50%; bottom: -22px; margin-left: -22px; border: 22px solid transparent; border-bottom: 0; border-top-color: rgba(241,246,255,.95); }
.speech .q { font: 500 33px/1.38 var(--sans); padding: 28px 40px; }
.speech .hdr { font: 700 30px var(--sans); padding: 30px 44px 8px; color: #10213f; }
.speech .row { display: flex; align-items: center; gap: 22px; padding: 14px 44px; font: 500 28px/1.3 var(--sans); }
.speech .ck { width: 42px; height: 42px; border-radius: 50%; border: 3px solid #94a3b8; flex: none; display: grid; place-items: center; }
.speech .ck svg { width: 26px; height: 26px; }
.chip { position: absolute; left: 0; top: 0; font: 600 24px var(--mono); color: #052e16; background: var(--kn-green); padding: 6px 14px; border-radius: 10px;
  box-shadow: 0 0 22px rgba(var(--kn-green-rgb), .6); transform: translate(-50%, -50%); }
.book { position: absolute; left: 0; top: 0; width: 300px; height: 190px; perspective: 900px; transform-origin: 50% 50%; }
.book .pg { position: absolute; top: 0; width: 150px; height: 190px; background: linear-gradient(90deg, #e9eef6, #ffffff); border: 1px solid #94a3b8; }
.book .pg.l { left: 0; border-radius: 8px 0 0 8px; } .book .pg.r { left: 150px; border-radius: 0 8px 8px 0; }
.book .pg.f { left: 150px; transform-origin: 0 50%; border-radius: 0 8px 8px 0; backface-visibility: visible; }
.book .pg i { position: absolute; left: 18px; right: 18px; height: 6px; border-radius: 3px; background: #b6c2d6; }
.book .cover { position: absolute; left: -8px; top: -8px; width: 316px; height: 206px; border-radius: 12px; background: #1d4ed8; }
.globe { position: absolute; left: 0; top: 0; }
.pill { position: absolute; left: 0; top: 0; font: 600 24px var(--sans); color: #052e16; background: var(--kn-green); padding: 6px 16px; border-radius: 999px; }

/* end card */
#endcard { z-index: 30; background: radial-gradient(ellipse 1300px 800px at 40% 40%, var(--kn-navy) 0%, var(--kn-navy-deep) 55%, var(--kn-navy-night) 100%); }
#endcard .wrap { position: absolute; left: 300px; top: 230px; display: flex; gap: 64px; align-items: center; }
#endcard img { width: 250px; height: 250px; border-radius: 56px; box-shadow: 0 0 80px rgba(var(--kn-green-rgb), .25); }
#endcard .wm { font: 800 170px/0.95 var(--sans); letter-spacing: -0.035em;
  background: linear-gradient(90deg, var(--kn-green), var(--kn-teal) 55%, var(--kn-blue)); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 12px; }
#endcard .tag { font: 700 50px var(--sans); color: var(--kn-ink); margin-top: 14px; letter-spacing: -0.01em; }
#endcard .plat { font: 500 30px var(--sans); color: var(--kn-ink-soft); margin-top: 22px; }
#endcard .surf { font: 600 27px var(--sans); color: var(--kn-green); margin-top: 12px; }
#endcard .cta { display: inline-block; font: 500 32px var(--mono); color: var(--kn-green-soft); margin-top: 34px; padding: 12px 24px; border-radius: 14px;
  background: rgba(2,10,22,.6); border: 1px solid rgba(var(--kn-green-rgb), .4); }
#endcard .url { font: 600 32px var(--sans); color: var(--kn-sky); margin-top: 22px; }
#endcard .credit { position: absolute; left: 0; width: 1920px; bottom: 34px; text-align: center; font: 500 20px var(--sans); color: var(--kn-muted); }
</style>
</head>
<body>
<div id="stage">
  <div id="world" class="layer">
    <div id="room" class="layer"><div id="wall"></div><div id="floor"></div><div id="floorGlow"></div>
      <div class="rack" id="rackL"></div><div class="rack" id="rackR"></div></div>
    <div id="desk" class="layer"><div class="lamp"></div><div class="top"></div><div class="edge"></div></div>
    <div id="cubes" class="layer"></div>
    <div id="iso" class="layer"><div class="isoCam"><div class="isoWorld"></div></div></div>
    <div id="props" class="layer"></div>
    <svg id="fx" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
    <div id="front" class="layer"></div>
  </div>
  <div id="tint" class="layer"></div>
  <div id="vignette" class="layer"></div>
  <div id="caption"></div>
  <div id="endcard" class="layer">
    <div class="wrap"><img alt="">
      <div><div class="wm">kube-noob</div><div class="tag"></div><div class="plat"></div><div class="surf"></div>
        <div class="cta"></div><div class="url"></div></div></div>
    <div class="credit"></div>
  </div>
  <div id="black" class="layer"></div>
</div>
<script>
// The brand (docs/brand/tokens.json), provided by demos/video/brand.js before this script runs. Without it the stage
// refuses to start, so nothing is ever rendered off-brand.
const KN = window.__KN_BRAND__;
if (!KN) throw new Error('kube-noob brand missing: render this page through demos/video/stage/capture.js');
const K = { green: KN.tokens.colors.green, greenRgb: KN.rgb.green, blue: KN.tokens.colors.blue };

"use strict";
const TL = window.__TIMELINE__;
const D = document;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeIO = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const back = t => { t = clamp(t); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function el(parent, html) { const t = D.createElement('template'); t.innerHTML = html.trim(); const e = t.content.firstElementChild; parent.appendChild(e); return e; }
function svgEl(parent, tag, attrs) { const e = D.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
const $ = id => D.getElementById(id);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const RED = [239, 90, 90], TEAL = [64, 190, 205], DIM = [120, 140, 170];
const mixc = (a, b, t) => a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',');

/* ------------------------------------------------------------------ components */
const C = {};   // name -> element, hidden every frame unless a scene shows it
function reg(name, e) { C[name] = e; e.style.display = 'none'; return e; }
function on(name) { const e = C[name]; e.style.display = ''; return e; }

// rocket mascot (the brand icon's rocket, upright, with arms)
let rkN = 0;
function makeRocket(parent, name) {
  const id = 'rk' + (rkN++);
  const e = el(parent, `<div class="rk"><svg width="240" height="460" viewBox="0 0 240 460">
  <defs>
   <linearGradient id="${id}b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a9cdfa"/></linearGradient>
   <linearGradient id="${id}f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${K.green}"/><stop offset="1" stop-color="#16a3a3"/></linearGradient>
   <linearGradient id="${id}l" x1=".5" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="#ffe45c"/><stop offset=".55" stop-color="#ff9f1c"/><stop offset="1" stop-color="#ff4d2e" stop-opacity="0"/></linearGradient>
   <radialGradient id="${id}v" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#21507e"/><stop offset="1" stop-color="#0a1a2c"/></radialGradient>
  </defs>
  <g class="flame"><path d="M120 318 C86 362 92 410 120 456 C148 410 154 362 120 318 Z" fill="url(#${id}l)"/><path d="M120 332 C106 362 108 392 120 418 C132 392 134 362 120 332 Z" fill="#fff3b0"/></g>
  <path class="hull" d="M60 266 L14 328 L14 348 L70 316 Z" fill="url(#${id}f)"/><path class="hull" d="M180 266 L226 328 L226 348 L170 316 Z" fill="url(#${id}f)"/>
  <g class="armL"><path class="a1" fill="none" stroke="#9fbbe0" stroke-width="22" stroke-linecap="round"/><path class="a2" fill="none" stroke="#f4f8ff" stroke-width="15" stroke-linecap="round"/><circle class="h" r="14" fill="#f4f8ff" stroke="#9fbbe0" stroke-width="3"/></g>
  <path class="hull" d="M120 40 C180 88 194 172 186 276 C184 306 170 328 120 328 C70 328 56 306 54 276 C46 172 60 88 120 40 Z" fill="url(#${id}b)" stroke="#8fb3e3" stroke-width="2"/>
  <path d="M120 40 C150 64 168 92 176 122 L64 122 C72 92 90 64 120 40 Z" fill="${K.blue}"/>
  <circle cx="120" cy="198" r="54" fill="${KN.tokens.colors.navy}"/><circle cx="120" cy="198" r="46" fill="url(#${id}v)"/>
  <g class="eyes"><circle cx="103" cy="190" r="8" fill="#fff"/><circle cx="137" cy="190" r="8" fill="#fff"/></g>
  <path d="M100 213 Q120 231 140 213" fill="none" stroke="${K.green}" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M90 172 Q103 158 120 158" fill="none" stroke="${KN.tokens.colors.sky}" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  <g class="clip" display="none"><rect x="0" y="0" width="96" height="124" rx="12" fill="#e2eaf6" stroke="#8ea6c8" stroke-width="3"/>
   <rect x="30" y="-8" width="36" height="16" rx="5" fill="#64748b"/>
   ${[0, 1, 2].map(i => `<rect x="12" y="${24 + i * 32}" width="22" height="22" rx="5" fill="#fff" stroke="#22c55e" stroke-width="3"/>
   <path class="ck${i}" d="M16 ${35 + i * 32} l5 6 l10 -12" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
   <rect x="42" y="${31 + i * 32}" width="40" height="8" rx="4" fill="#9aabc4"/>`).join('')}</g>
  <g class="armR"><path class="a1" fill="none" stroke="#9fbbe0" stroke-width="22" stroke-linecap="round"/><path class="a2" fill="none" stroke="#f4f8ff" stroke-width="15" stroke-linecap="round"/><circle class="h" r="14" fill="#f4f8ff" stroke="#9fbbe0" stroke-width="3"/>
   <rect class="thumb" x="-7" y="-36" width="14" height="28" rx="7" fill="#f4f8ff" stroke="#9fbbe0" stroke-width="3" display="none"/></g>
  </svg></div>`);
  const q = s => e.querySelector(s);
  const r = { e, hull: [...e.querySelectorAll('.hull')], flying: false, flame: q('.flame'), eyes: q('.eyes'), clip: q('.clip'), thumb: q('.thumb'),
    L: { a1: q('.armL .a1'), a2: q('.armL .a2'), h: q('.armL .h') }, R: { a1: q('.armR .a1'), a2: q('.armR .a2'), h: q('.armR .h') },
    cks: [0, 1, 2].map(i => q('.ck' + i)) };
  if (name) reg(name, e);
  return r;
}
const HANDS = { restL: [30, 300], restR: [210, 300], clipR: [214, 222], thumbR: [222, 166], waveR: [226, 150] };
function arm(a, sx, sy, hx, hy, out) {
  const cx = (sx + hx) / 2 + out * 18, cy = (sy + hy) / 2 + 14;
  const d = `M${sx} ${sy} Q${cx} ${cy} ${hx} ${hy}`;
  a.a1.setAttribute('d', d); a.a2.setAttribute('d', d); a.h.setAttribute('cx', hx); a.h.setAttribute('cy', hy);
}
// o: {x, y, rot, sc, t (global time), right: [hx,hy], left: [hx,hy], clip: 0..1, checks: 0..3, thumb: bool, flame,
//     flying: true while it flies past things (the brand rule "never behind or across a window" is for where it rests)}

/* terminal */
const PROMPT = /^(\$ |> |\/)/;
function tokens(line) {
  if (line.startsWith('$ ')) return [['tp', '$ '], ['tc', line.slice(2)]];
  if (line.startsWith('> ')) return [['tp', '> '], ['tc', line.slice(2)]];
  if (line.startsWith('/')) return [['tp', '> '], ['tc', line]];
  if (line.startsWith('#') || line.startsWith('… ')) return [['tk', line]];  // a comment, or lines left out
  const out = [];
  const re = /(\[HIGH[^\]]*\]|\bHIGH\b|\bMED\b|●|score[ =]\d+(\.\d+)?(\/100)?|high=\d+|medium=\d+|low=\d+|\bmodel none\b|\bweb off\b|\bcluster off\b|closed \(listens on 127\.0\.0\.1 only\)|deleted|Error from server \(NotFound\)|not found|\d+ tools|→)/g;
  let last = 0, m;
  while ((m = re.exec(line))) {
    if (m.index > last) out.push(['', line.slice(last, m.index)]);
    const s = m[0];
    let cls = 'tn';
    if (/HIGH|deleted|NotFound|not found/.test(s)) cls = 'th';
    else if (/MED|medium/.test(s)) cls = 'tm';
    else if (s === '●' || /off|none|closed|tools/.test(s)) cls = 'tb';
    else if (s === '→') cls = 'tg';
    out.push([cls, s]);
    last = m.index + s.length;
  }
  if (last < line.length) out.push(['', line.slice(last)]);
  return out;
}
function lineLen(line) { return tokens(line).reduce((n, [, s]) => n + s.length, 0); }
function makeTerm(parent, name, opts) {
  const e = el(parent, `<div class="term"><div class="hd"><i style="background:var(--kn-danger)"></i><i style="background:var(--kn-warning)"></i><i style="background:${K.green}"></i>
     <span class="t"></span><div class="r"><b></b><b></b><b></b><span style="color:rgba(255,255,255,.45);font:400 20px var(--sans);margin-left:6px">×</span></div></div>
     <div class="bd"><div class="sc"></div></div></div>`);
  reg(name, e);
  return { e, sc: e.querySelector('.sc'), title: e.querySelector('.t'), cache: '' };
}
function schedule(lines, start, endBy) {
  const typed = lines.map(l => PROMPT.test(l));
  const chars = lines.reduce((n, l, i) => n + (typed[i] ? lineLen(l) : 0), 0);
  const outs = typed.filter(x => !x).length, cmds = typed.filter(x => x).length;
  const avail = Math.max(0.5, endBy - start - outs * 0.11 - cmds * 0.3);
  const cps = clamp(chars / avail, 26, 95);
  let t = start;
  return lines.map((l, i) => {
    const s = { t0: t, typed: typed[i], len: lineLen(l) };
    t += typed[i] ? s.len / cps + 0.3 : 0.11;
    s.t1 = t;
    return s;
  });
}
function drawTerm(T, o) {
  const e = T.e;
  e.style.display = '';
  e.style.left = o.x + 'px'; e.style.top = o.y + 'px'; e.style.width = o.w + 'px'; e.style.height = o.h + 'px';
  e.style.setProperty('--tc', o.tc); e.style.setProperty('--tx', o.tx); e.style.setProperty('--fs', (o.fs || 22) + 'px');
  e.style.opacity = o.op ?? 1;
  e.style.transform = o.tf || '';
  e.style.background = o.solid ? 'linear-gradient(160deg, rgba(var(--tc), .10), rgba(6,16,32,.95) 40%, rgba(5,12,26,.97))' : '';
  T.title.textContent = o.title || '';
  let html = '';
  if (o.bars) {
    const r = rng(o.seed || 5);
    html = '<div class="bars">' + Array.from({ length: o.bars }, (_, i) => {
      const w = 30 + r() * 60, g = clamp((o.local - 0.15 * i) / 0.6);
      return `<i style="width:${(w * g).toFixed(1)}%"></i>`; }).join('') + '</div>';
  } else {
    const sch = o.sched;
    o.lines.forEach((line, i) => {
      const s = sch[i];
      if (o.local < s.t0) return;
      let n = s.typed ? Math.floor((o.local - s.t0) / Math.max(0.01, s.t1 - 0.3 - s.t0) * s.len) : s.len;
      n = Math.min(n, s.len);
      let rem = n, inner = '';
      for (const [cls, txt] of tokens(line)) {
        if (rem <= 0) break;
        const part = txt.slice(0, rem); rem -= part.length;
        inner += cls ? `<span class="${cls}">${esc(part)}</span>` : esc(part);
      }
      const typing = s.typed && o.local < s.t1 - 0.3;
      const last = i === o.lines.length - 1 || o.local < sch[i + 1].t0;
      const cur = (typing || (last && Math.floor(o.local * 2.2) % 2 === 0)) ? '<span class="cur"></span>' : '';
      html += `<div class="ln">${inner}${last ? cur : ''}</div>`;
    });
  }
  if (html !== T.cache) { T.sc.innerHTML = html; T.cache = html; }
  const bd = T.sc.parentElement;
  const over = T.sc.scrollHeight - bd.clientHeight;
  T.sc.style.transform = `translateY(${over > 0 ? -over : 0}px)`;
}

function drawCubes(T, o) {

  cubes.forEach((c, i) => {

    const bob = Math.sin(T * 0.7 + c.ph) * 14;
    const px = c.x + Math.sin(T * 0.21 + c.ph) * 10;
    c.e.style.display = v > 0.01 ? '' : 'none';
    c.e.style.transform = `translate3d(${px}px, ${c.y + bob}px, ${c.z}px) rotateX(${c.rx + T * c.vx}deg) rotateY(${c.ry + T * c.vy}deg) scale(${v})`;
    c.e.style.setProperty('--fa', c.hot && o.hot ? 0.62 : 0.17);

    const persp = 1400 / (1400 - c.z);

    if (p > 0 && p < 1) {
      c.puff.style.display = '';
      c.puff.style.transform = `translate(${sx}px, ${sy}px) scale(${(0.35 + 1.4 * easeOut(p)) * c.s / 60 * persp})`;

        s.e.style.transform = `translate(${sx + Math.cos(s.a) * d}px, ${sy + Math.sin(s.a) * d + 60 * p * p}px) rotate(${p * 400 + s.k * 40}deg) scale(${1 - p})`;

  if (c.dataset.html !== inner) { c.innerHTML = inner; c.dataset.html = inner; }

    const th = easeOut(clamp((L - 0.6) / 0.6));
    const R = [lerp(HANDS.restR[0], HANDS.thumbR[0], th), lerp(HANDS.restR[1], HANDS.thumbR[1], th)];
    drawRocket(ROCKET, { x: 1700, y: 700 + Math.sin(T * 1.6) * 6, sc: 0.72, t: T, right: R, thumb: th > 0.6, flame: 0.8 });
  },
  end(L, dur, sc, T) { endcard(L, dur); }
};

/* ------------------------------------------------------------------ frame */
function sceneAt(t) {
  const s = TL.scenes;
  for (let i = s.length - 1; i >= 0; i--) if (t >= s[i].start - 1e-6) return s[i];
  return s[0];
}
function renderAt(t) {
  fxReset(); defsOnce();
  for (const k in C) C[k].style.display = 'none';
  for (const id of ['cubes', 'desk', 'tint', 'endcard']) $(id).style.display = 'none';
  $('cubes').style.opacity = 1;
  const sc = sceneAt(t);
  const L = t - sc.start;
  KINDS[sc.kind](L, sc.dur, sc, t);
  caption(sc, L);
  const b = $('black');
  b.style.opacity = Math.max(1 - sstep(0, 0.45, t), sstep(TL.duration - 0.6, TL.duration, t));
}
async function init() {
  const e = $('endcard');
  e.querySelector('img').src = KN.icon;
  e.querySelector('.tag').textContent = KN.tokens.tagline;
  e.querySelector('.plat').textContent = KN.tokens.platforms;
  e.querySelector('.surf').textContent = KN.tokens.surfaces;
  e.querySelector('.cta').textContent = TL.cta;
  e.querySelector('.url').textContent = KN.tokens.url;
  e.querySelector('.credit').textContent = TL.credit;
  buildCubes();
  makeChat($('props'), 'chat');
  ROCKET = makeRocket($('front'), 'rocket');
  TERM = makeTerm($('props'), 'term');
  const kinds = new Set(TL.scenes.map(s => s.kind));
  if (['pod', 'loopback', 'lock', 'gauge', 'pullback'].some(k => kinds.has(k))) buildIso(); else $('iso').style.display = 'none';
  if (['desk', 'beam', 'explain', 'local'].some(k => kinds.has(k))) buildDesk();
  for (const s of TL.scenes) if (s.term) {
    const typedEnd = s.kind === 'install' ? s.dur * 0.62 : s.dur * 0.72;
    s._s = schedule(s.term, s.kind === 'cta' ? 0.5 : 0.55, typedEnd);
  }
  await D.fonts.ready;
  const img = e.querySelector('img');
  if (!img.complete) await new Promise(r => { img.onload = r; img.onerror = r; });
  window.stageReady = true;
}
window.renderAt = renderAt;
// The brand rule for the mascot, checked on the frame just rendered (capture.js --check runs it on every frame):
// a resting rocket may not overlap a visible terminal, caption or label.
function visible(e) {
  if (!e || e.style.display === 'none') return false;
  for (let n = e; n && n !== D.body; n = n.parentElement) {
    const cs = getComputedStyle(n);
    if (cs.display === 'none' || Number(cs.opacity) < 0.05) return false;
  }
  return true;
}
function overlap(a, b) {
  const w = Math.min(a.right, b.right) - Math.max(a.left, b.left), h = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
  return w > 0 && h > 0 ? Math.round(w * h) : 0;
}
window.layoutIssues = () => [...rocketIssues(), ...labelsUnderRockets(), ...captionCovered()];
function rocketIssues() {
  if (!ROCKET || ROCKET.flying || !visible(ROCKET.e)) return [];
  const rs = ROCKET.hull.map(h => h.getBoundingClientRect());
  const box = { left: Math.min(...rs.map(r => r.left)), top: Math.min(...rs.map(r => r.top)),
    right: Math.max(...rs.map(r => r.right)), bottom: Math.max(...rs.map(r => r.bottom)) };
  const out = [];
  if (TERM && visible(TERM.e)) {
    const a = overlap(box, TERM.e.getBoundingClientRect());
    if (a > 0) out.push(`rocket overlaps the terminal (${a} px²)`);
  }
  if (visible($('caption'))) { // the caption box spans the frame: compare with its text only
    const a = overlap(box, textBox($('caption')));
    if (a > 0) out.push(`rocket overlaps the caption (${a} px²)`);
  }
  return out;
}
// No word on screen sits under a mascot or its flame, in any scene ("kube-noob" stays hyphenated).
function labelsUnderRockets() {
  const labels = [...D.querySelectorAll('.label')].filter(visible);
  const rockets = [ROCKET, ISO.rk, ...(ISO.extra || []).map(p => p.r)].filter(r => r && !r.flying && visible(r.e));
  const out = [];
  for (const r of rockets) {
    const parts = [...r.hull, r.flame].map(h => h.getBoundingClientRect());
    for (const l of labels) {
      const a = parts.reduce((n, b) => n + overlap(b, l.getBoundingClientRect()), 0);
      if (a > 0) out.push(`rocket overlaps the label "${l.textContent}" (${a} px²)`);
    }
  }
  return out;
}
// A caption is never drawn underneath another element (a terminal, a speech bubble).
function captionCovered() {
  const c = $('caption');
  if (!visible(c)) return [];
  const r = textBox(c);
  // the first visible thing at the caption's centre, ignoring full-frame layers (the fade to black, the vignette)
  const stack = D.elementsFromPoint((r.left + r.right) / 2, (r.top + r.bottom) / 2);
  const top = stack.find(e => e === c || c.contains(e)
    || (!(e.classList && e.classList.contains('layer')) && e.id !== 'stage' && e !== D.body && e !== D.documentElement
        && visible(e)));
  return top && top !== c && !c.contains(top) ? [`caption is covered by ${top.className || top.tagName}`] : [];
}
function textBox(e) {
  const range = D.createRange(); range.selectNodeContents(e);
  return range.getBoundingClientRect();
}
init();
</script>
