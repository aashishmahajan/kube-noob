<!doctype html>
<html><head><meta charset="utf-8"><title>kube-noob walkthrough</title>
<style>
  /* --sans, --mono and the --kn-* colours come from docs/brand via demos/video/brand.js (capture_page.js) */
  :root { --bg:var(--kn-navy-night); --panel:var(--kn-panel); --ink:var(--kn-ink); --dim:var(--kn-muted); --green:var(--kn-green); --red:var(--kn-danger); --amber:var(--kn-warning); --sky:var(--kn-sky); }
  html,body { margin:0; width:1920px; height:1080px; background:var(--bg); color:var(--ink); overflow:hidden; font-family:var(--sans); }
  /* the backdrop of every frame: an aurora of the brand colours over a faint grid, drifting slowly */
  #sky { position:absolute; inset:-120px; filter:blur(70px); opacity:.85;
    background:
      radial-gradient(34% 42% at 14% 26%, rgba(var(--kn-blue-rgb), .42), transparent 70%),
      radial-gradient(28% 36% at 84% 16%, rgba(var(--kn-green-rgb), .20), transparent 70%),
      radial-gradient(32% 40% at 70% 86%, rgba(var(--kn-teal-rgb), .24), transparent 70%); }
  #grid { position:absolute; inset:0; opacity:.55;
    background-image:linear-gradient(rgba(var(--kn-sky-rgb), .07) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--kn-sky-rgb), .07) 1px, transparent 1px);
    background-size:64px 64px; -webkit-mask-image:radial-gradient(ellipse 75% 65% at 50% 45%, #000 25%, transparent 80%); }
  .card { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; transition:opacity .5s; }
  .card h1 { font-size:76px; font-weight:800; margin:0; letter-spacing:-1px; }
  .card h2 { font-size:40px; margin:0; color:var(--dim); font-weight:500; max-width:1500px; line-height:1.3; }
  .card code { font-family:var(--mono); font-weight:500; background:rgba(var(--kn-navy-night-rgb), .7); border:1px solid rgba(var(--kn-green-rgb), .4); padding:10px 22px; border-radius:14px; font-size:34px; display:inline-block; margin:10px; color:var(--kn-green-soft); }
  .icon { width:190px; height:190px; border-radius:44px; box-shadow:0 0 80px rgba(var(--kn-green-rgb), .25); }
  .wm { font:800 150px/0.95 var(--sans); letter-spacing:-0.035em; padding-bottom:12px;
    background:linear-gradient(90deg, var(--kn-green), var(--kn-teal) 55%, var(--kn-blue)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag { font:700 50px var(--sans); color:var(--ink); margin:10px 0 26px; letter-spacing:-0.01em; }
  #title .icon { margin-bottom:28px; }
  #end { justify-content:flex-start; padding-top:170px; box-sizing:border-box; }
  #end .row { display:flex; gap:56px; align-items:center; text-align:left; }
  #end .tag { margin:6px 0 0; }
  #end .plat { font:500 30px var(--sans); color:var(--kn-ink-soft); margin-top:18px; }
  #end .surf { font:600 27px var(--sans); color:var(--green); margin-top:10px; }
  #end h1 { margin-top:64px; font-size:56px; }
  #endCodes { margin-top:14px; }
  #end .url { font:600 40px var(--sans); color:var(--sky); margin-top:22px; }
  #end .credit { position:absolute; left:0; right:0; bottom:34px; font:500 20px var(--sans); color:var(--dim); }
  /* chapter card: a big number, the title, and where we are */
  #chapterCard { flex-direction:row; gap:56px; }
  #chapterNo { font:800 260px/0.9 var(--sans); letter-spacing:-0.05em;
    background:linear-gradient(160deg, var(--kn-blue), var(--kn-teal) 60%, var(--kn-green)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #chapterText { font-size:68px; font-weight:800; letter-spacing:-0.02em; text-align:left; max-width:1000px; line-height:1.1; }
  #chapterCard .dots { margin-top:28px; justify-content:flex-start; }
  /* a step: the point on the left, the terminal on the right, sized to what it shows */
  #stage { position:absolute; inset:0; opacity:0; transition:opacity .5s; }
  #rail { position:absolute; left:80px; top:110px; width:500px; bottom:110px; display:flex; flex-direction:column; }
  #railNo { font:800 120px/1 var(--sans); letter-spacing:-0.04em; color:rgba(var(--kn-sky-rgb), .28); }
  #chapter { font-size:46px; font-weight:800; line-height:1.12; letter-spacing:-0.02em; margin-top:10px; }
  #caption { margin-top:34px; font-size:34px; font-weight:500; line-height:1.35; color:var(--kn-ink-soft); padding-left:24px; border-left:5px solid var(--green); }
  #rail .spacer { flex:1; }
  .dots { display:flex; gap:12px; }
  .dots i { width:14px; height:14px; border-radius:50%; background:rgba(var(--kn-sky-rgb), .22); }
  .dots i.on { background:var(--green); box-shadow:0 0 18px rgba(var(--kn-green-rgb), .7); }
  .dots i.done { background:rgba(var(--kn-green-rgb), .45); }
  #brand { margin-top:22px; font-size:24px; color:var(--dim); }
  #termWrap { position:absolute; left:640px; right:72px; top:70px; bottom:70px; display:flex; align-items:center; }
  #term { position:relative; width:100%; background:linear-gradient(170deg, rgba(var(--kn-panel-rgb), .97), rgba(var(--kn-navy-night-rgb), .97));
    border-radius:22px; border:1px solid rgba(var(--kn-sky-rgb), .22);
    box-shadow:0 40px 120px -30px rgba(var(--kn-navy-night-rgb), .9), 0 0 90px -30px rgba(var(--kn-blue-rgb), .6);
    padding:64px 44px 34px; box-sizing:border-box; font-family:var(--mono); line-height:1.46; white-space:pre-wrap; overflow:hidden;
    transform-origin:50% 50%; transition:height .45s ease; }
  #term .bar { position:absolute; top:22px; left:26px; display:flex; gap:9px; }
  #term .bar span { width:15px; height:15px; border-radius:50%; }
  #term .bar span:nth-child(1) { background:var(--red); } #term .bar span:nth-child(2) { background:var(--amber); } #term .bar span:nth-child(3) { background:var(--green); }
  #term .bar b { position:absolute; left:84px; top:-4px; font:500 20px var(--mono); color:var(--dim); white-space:nowrap; }
  #lines > div { border-radius:8px; padding:0 10px; margin:0 -10px; transition:background .5s, box-shadow .5s; }
  #lines > div.key { background:rgba(var(--kn-blue-rgb), .16); box-shadow:inset 4px 0 0 var(--sky); }
  #lines > div.key.bad { background:rgba(var(--kn-danger-rgb), .14); box-shadow:inset 4px 0 0 var(--red); }
  #lines > div.key.good { background:rgba(var(--kn-green-rgb), .12); box-shadow:inset 4px 0 0 var(--green); }
  #measure { position:absolute; left:-99999px; top:0; font-family:var(--mono); line-height:1.46; white-space:pre; }
  .prompt { color:var(--green); }
  .cmd { color:var(--ink); font-weight:500; }
  .high { color:var(--red); font-weight:600; }
  .med { color:var(--amber); }
  .ok { color:var(--green); font-weight:600; }
  .why { color:var(--dim); }
  .cite { color:var(--sky); }
  .cursor { display:inline-block; width:.55em; height:1.05em; background:var(--green); vertical-align:-.17em; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
</style></head>
<body>
<div id="sky"></div><div id="grid"></div>
<div id="title" class="card" style="opacity:0">
  <img class="icon" alt="">
  <div class="wm">kube-noob</div>
  <div class="tag" id="titleTag"></div>
  <h2 id="titleSub"></h2>
</div>
<div id="chapterCard" class="card" style="opacity:0"><div id="chapterNo"></div>
  <div><h1 id="chapterText"></h1><div class="dots" id="chapterDots"></div></div></div>
<div id="stage">
  <div id="rail"><div id="railNo"></div><div id="chapter"></div><div id="caption"></div><div class="spacer"></div>
    <div class="dots" id="railDots"></div><div id="brand"></div></div>
  <div id="termWrap"><div id="term"><div class="bar"><span></span><span></span><span></span><b>kube-noob · offline · read-only</b></div><div id="lines"></div></div></div>
</div>
<div id="measure"></div>
<div id="end" class="card" style="opacity:0">
  <div class="row"><img class="icon" alt="">
    <div><div class="wm">kube-noob</div><div class="tag" id="endTag"></div><div class="plat" id="endPlat"></div><div class="surf" id="endSurf"></div></div></div>
  <h1 id="endTitle"></h1>
  <div id="endCodes"></div>
  <div class="url" id="endUrl"></div>
  <div class="credit" id="endCredit"></div>
</div>
<script>
const KN = window.__KN_BRAND__;
if (!KN) throw new Error('kube-noob brand missing: render this page through demos/video/capture_page.js');
const SCENES = __SCENES__;
const META = __META__;
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
for (const img of document.querySelectorAll("img.icon")) img.src = KN.icon;
for (const id of ["titleTag", "endTag"]) document.getElementById(id).textContent = KN.tokens.tagline;
document.getElementById("endPlat").textContent = KN.tokens.platforms;
document.getElementById("endSurf").textContent = KN.tokens.surfaces;
document.getElementById("endUrl").textContent = KN.tokens.url;
document.getElementById("titleSub").textContent = META.titleSub;
document.getElementById("brand").textContent = META.brand;
document.getElementById("endTitle").textContent = META.endTitle;
document.getElementById("endCodes").innerHTML = META.endCodes.map(c => `<code>${esc(c)}</code>`).join("");
document.getElementById("endCredit").textContent = META.credit || "";
const sleep = ms => new Promise(r => setTimeout(r, ms));
// Scene marks for the sound track (capture_page.js saves them), and holds so narration fits each scene.
window.__marks = [];
const HOLD = META.minMs || {};
const mark = id => { window.__marks.push({ id, t: performance.now() }); return performance.now(); };
const holdUntil = async t => { const left = t - performance.now(); if (left > 0) await sleep(left); };
function color(line) {
  let h = esc(line);
  if (/^\s*(why:|… )/.test(line)) return `<span class="why">${h}</span>`;  // … marks lines left out
  h = h.replace(/\[HIGH\s*\]|\bhigh=\d+/g, m => `<span class="high">${m}</span>`)
       .replace(/\bmedium=\d+/g, m => `<span class="med">${m}</span>`)
       .replace(/(\d+\/\d+ passed|passed: True|status: ready|posture: OK|offline lock\s+ON|score 100\.0\/100)/g, m => `<span class="ok">${m}</span>`)
       .replace(/\[kn:[^\]]+\]/g, m => `<span class="cite">${m}</span>`)
       .replace(/(read-only first:|asks before running\):|closed \(listens on 127\.0\.0\.1 only\)|connected)/g, m => `<span class="ok">${m}</span>`)
       .replace(/^(Claude|kube-noob|tool) ›/, m => `<span class="cite">${m}</span>`);
  return h;
}
// The lines a viewer should look at once the output is on screen: findings, scores, verdicts, read-only steps.
function keyClass(line) {
  if (/\[HIGH|\[CRITICAL|\bDBG-[A-Z-]+:|rejected|denied|OOMKilled/.test(line)) return "key bad";
  if (/passed|status: ready|posture: OK|offline lock\s+ON|changes applied|score \d|saved \[kn:|read-only first:/.test(line)) return "key good";
  if (/\[kn:[^\]]+\]|score=/.test(line)) return "key";
  return "";
}
const dots = (box, at) => { box.innerHTML = SCENES.map((_, i) => `<i class="${i < at ? "done" : i === at ? "on" : ""}"></i>`).join(""); };
const number = i => String(i + 1).padStart(2, "0");
// The terminal is as big as what it will show: the largest font (between MIN and MAX px) at which every line, wrapped
// to the terminal's width, fits its height. Large type matters more than keeping long lines on one row.
const MAX_FONT = 36, MIN_FONT = 22;
function fit(step) {
  const term = document.getElementById("term"), wrap = document.getElementById("termWrap"), m = document.getElementById("measure");
  const width = wrap.clientWidth - 88, height = wrap.clientHeight - 98;
  m.textContent = [`${step.prompt || "$"} ${step.command}`, ...step.output].join("\n");
  m.style.width = width + "px"; m.style.whiteSpace = "pre-wrap";
  let size = MAX_FONT;
  for (; size > MIN_FONT; size--) {
    m.style.fontSize = size + "px";
    if (m.scrollHeight <= height) break;
  }
  m.style.fontSize = size + "px";
  term.style.fontSize = size + "px";
  term.style.height = Math.min(wrap.clientHeight, m.scrollHeight + 98) + "px";
}
async function typeCmd(lines, cmd) {
  const row = document.createElement("div");
  row.innerHTML = `<span class="prompt"></span><span class="cmd"></span><span class="cursor"></span>`;
  row.querySelector(".prompt").textContent = (typeCmd.prompt || "$") + " ";
  lines.appendChild(row);
  const target = row.querySelector(".cmd");
  const per = Math.max(8, Math.min(26, 1400 / Math.max(1, cmd.length))); // a long command types fast: about 1.4 s
  for (const ch of cmd) { target.textContent += ch; await sleep(per); }
  await sleep(300);
  row.querySelector(".cursor").remove();
}
// A slow push-in while a step is on screen, so no frame stands still.
let drift = null;
function pushIn(on) {
  const term = document.getElementById("term");
  if (drift) cancelAnimationFrame(drift);
  if (!on) { term.style.transform = ""; return; }
  const t0 = performance.now();
  const tick = t => { const p = Math.min(1, (t - t0) / 9000); term.style.transform = `scale(${1 + 0.025 * p})`; if (p < 1) drift = requestAnimationFrame(tick); };
  drift = requestAnimationFrame(tick);
}
async function run() {
  const title = document.getElementById("title"), stage = document.getElementById("stage");
  const cc = document.getElementById("chapterCard"), ct = document.getElementById("chapterText");
  await sleep(300); const t0 = mark("title"); await show(title, true); await sleep(3800);
  await holdUntil(t0 + (HOLD.title || 0)); await show(title, false);
  for (const [i, scene] of SCENES.entries()) {
    const s0 = mark(scene.id);
    const name = scene.chapter.replace(/^\d+\.\s*/, "");
    document.getElementById("chapterNo").textContent = number(i);
    ct.textContent = name; dots(document.getElementById("chapterDots"), i);
    await show(cc, true); await sleep(1600); await show(cc, false);
    document.getElementById("railNo").textContent = number(i);
    document.getElementById("chapter").textContent = name;
    dots(document.getElementById("railDots"), i);
    await show(stage, true);
    for (const step of scene.steps) {
      const lines = document.getElementById("lines"); lines.innerHTML = "";
      document.getElementById("caption").textContent = step.caption;
      fit(step); pushIn(true);
      await sleep(500);
      typeCmd.prompt = step.prompt || "$";
      await typeCmd(lines, step.command);
      const rows = [];
      for (const l of step.output) { const d = document.createElement("div"); d.innerHTML = color(l) || "&nbsp;"; lines.appendChild(d); rows.push([d, l]); await sleep(55); }
      await sleep(350);
      for (const [d, l] of rows) { const k = keyClass(l); if (k) { d.className = k; await sleep(120); } }
      await sleep(Math.min(5200, 2400 + step.output.length * 140));
    }
    pushIn(false);
    await holdUntil(s0 + (HOLD[scene.id] || 0));
    await show(stage, false);
  }
  const e0 = mark("end"); await show(document.getElementById("end"), true); await sleep(5500);
  await holdUntil(e0 + (HOLD.end || 0));
  window.__done = true;
}
async function show(el, on) { el.style.opacity = on ? 1 : 0; await sleep(550); }
window.__ready = Promise.all([...document.querySelectorAll("img.icon")].map(i => i.decode()));
window.__ready.then(run);
</script></body></html>
