[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kube-noob"
dynamic = ["version"]
description = "Kubernetes, Helm, OpenShift, ROSA HCP and RHACS expertise as deterministic tools: audit, diagnose, cited search, learning. No AI inside: use it from Claude, OpenShift Lightspeed, any MCP client or the CLI."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11.4"
authors = [{ name = "kube-noob maintainers" }]
keywords = [
  "kubernetes", "openshift", "rosa", "hypershift", "helm", "stackrox", "rhacs",
  "mcp", "model-context-protocol", "sre", "security", "manifest-audit", "learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Clustering",
  "Topic :: System :: Systems Administration",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=2.3,<3",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0.2,<7",
  "jsonschema>=4.23,<5",
  "httpx>=0.27,<1",
  "anthropic>=2.0,<3",
  "uvicorn>=0.31,<1",
  "starlette>=0.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "build>=1.2",
  "pip-audit>=2.7",
  "uv>=0.11",
]

[project.scripts]
kube-noob = "kube_noob.cli:main"

[project.urls]
Homepage = "https://github.com/aashishmahajan/kube-noob"
Source = "https://github.com/aashishmahajan/kube-noob"
Issues = "https://github.com/aashishmahajan/kube-noob/issues"
Security = "https://github.com/aashishmahajan/kube-noob/security/policy"
Documentation = "https://github.com/aashishmahajan/kube-noob/tree/main/docs"
Changelog = "https://github.com/aashishmahajan/kube-noob/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/kube_noob/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kube_noob"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "kube_noob/data/examples"

[tool.hatch.build.targets.sdist]
include = [
  "src/kube_noob",
  "tests",
  "README.md",
  "LICENSE",
  "NOTICE",
  "SECURITY.md",
  "CHANGELOG.md",
  "THIRD_PARTY_NOTICES.md",
  "requirements.lock",
  "server.json",
  "Containerfile",
  "deploy",
  "plugin",
  ".claude-plugin",
  "scripts",
  "examples",
  "demos",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF", "PL"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLC0415",
  "S603",    # subprocess without shell is the deliberate, allowlisted design in cluster.kubectl
  "RUF001", "RUF002", "RUF003",
  "PLR0917", # keyword-heavy internal helpers are clearer positional
  "RUF005",
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S108", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
packages = ["kube_noob"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["jsonschema.*", "anthropic.*", "uvicorn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["kube_noob.server.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "cluster: needs a live Kubernetes cluster (KUBE_NOOB_TEST_CLUSTER=1)",
  "network: needs outbound network",
]

[tool.coverage.run]
source = ["kube_noob"]
branch = true
