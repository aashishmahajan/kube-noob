- id: cluster-role
  rule: KN-S015
  scope: {kind: ClusterRole, name: monitoring-reader}
  owner: team-observability
  reason: The reader aggregates every monitoring API group
  expires: 2027-01-31
- id: unused
  rule: KN-S020
  scope: {namespace: shop}
  owner: platform
  reason: Nothing in the bundle unmasks /proc any more
  expires: 2027-01-31
