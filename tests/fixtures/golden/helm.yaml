- id: helm-013
  technology: helm
  kind: howto
  question: 'I ran helm push ./mychart oci://registry.example.com/charts/mychart:0.1.0 and it was rejected. How do I publish
    a chart to an OCI registry correctly?'
  answer: 'Package first with helm package to get mychart-0.1.0.tgz, log in with helm registry login, then run helm push mychart-0.1.0.tgz
    oci://registry.example.com/charts. The reference needs oci:// but no chart name or tag; both come from Chart.yaml. Some
    registries need the repository created first.'
  source:
    repo: helm/helm-www
    path: versioned_docs/version-3/topics/registries.md
    commit: e5a4c621283c8551426adce8cb27a2cc3f402ea8
    url: 'https://helm.sh/docs/v3/topics/registries/'
  outOfScope: false
  status: miss
  gap: 'doc: Helm OCI push workflow (helm package, helm registry login, helm push tgz oci://host/path)'
- id: helm-014
  technology: helm
  kind: concept
  question: What changed in how Helm 3 computes upgrades and rollbacks compared to Helm 2, and why does it matter if someone
    ran kubectl scale on a Helm-managed Deployment?
  answer: Helm 2 diffed only the old and new chart manifests, ignoring live changes. Helm 3 builds a three-way strategic merge
    patch from the old manifest, the live state and the new manifest, so a rollback restores replicas to 3 even if someone
    scaled the live Deployment to 0.
  source:
    repo: helm/helm-www
    path: versioned_docs/version-3/faq/changes_since_helm2.md
    commit: e5a4c621283c8551426adce8cb27a2cc3f402ea8
    url: 'https://helm.sh/docs/v3/faq/changes_since_helm2/'
  outOfScope: false
  status: miss
  gap: 'doc: Helm 3 three-way strategic merge patch for upgrades and rollbacks vs Helm 2'
- id: helm-015
  technology: helm
  kind: concept
  question: I edited a CRD file in my chart's crds/ directory and ran helm upgrade, but the CRD in the cluster did not change.
    Is that a bug? What are Helm 3's rules for CRDs?
  answer: By design. CRDs in crds/ must be plain, untemplated YAML and are installed before the rest of the chart, on install
    only. Helm never reinstalls, upgrades or deletes them, since deleting a CRD wipes all its custom resources. Upgrade or
    remove CRDs manually and carefully.
  source:
    repo: helm/helm-www
    path: versioned_docs/version-3/topics/charts.md
    commit: e5a4c621283c8551426adce8cb27a2cc3f402ea8
    url: 'https://helm.sh/docs/v3/topics/charts/'
  outOfScope: false
  status: miss
  gap: 'doc: Helm 3 crds/ directory rules (plain YAML, install only, never upgraded or deleted)'
- id: helm-016
  technology: helm
  kind: concept
  question: My chart has a pre-install Job hook. What happens if that Job fails, and why is the Job still there after helm
    uninstall?
  answer: Helm waits for Job and Pod hooks to finish, and a failed hook fails the release. Hook resources are not tracked
    as part of the release, so uninstall does not remove them. Use a helm.sh/hook-delete-policy annotation (the default is
    before-hook-creation) or a Job TTL to clean up.
  source:
    repo: helm/helm-www
    path: versioned_docs/version-3/topics/charts_hooks.md
    commit: e5a4c621283c8551426adce8cb27a2cc3f402ea8
    url: 'https://helm.sh/docs/v3/topics/charts_hooks/'
  outOfScope: false
  status: miss
  gap: 'doc: Helm hooks lifecycle, failed hook fails release, hook resources untracked, helm.sh/hook-delete-policy'
