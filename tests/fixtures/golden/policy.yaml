  source: {}
  outOfScope: true
  status: miss
  gap: 'abstain: kn:k8s-images#0 should not have fired for an AWS IAM question'
- id: pol-010
  technology: policy
  kind: error
  question: 'On a private GKE cluster every Pod create fails with: Internal error occurred: failed calling webhook "validate.kyverno.svc-fail":
    failed to call webhook: Post "https://kyverno-svc.kyverno.svc:443/validate/fail?timeout=10s": context deadline exceeded.
    The Kyverno pods show Running. What is wrong?'
  answer: Private GKE control planes cannot reach nodes on Kyverno's webhook port by default, so the API server call times
    out. Add a firewall rule that lets the control plane reach the worker nodes on TCP 9443, Kyverno's default webhook port.
  source:
    repo: kyverno/website
    path: src/content/docs/docs/guides/troubleshooting.md
    commit: b0131526d7d8d6e4fa80856adb75aa4d7b2f4c89
    url: 'https://kyverno.io/docs/guides/troubleshooting/#kyverno-fails-on-gke'
  outOfScope: false
  status: pass
  expect:
  - DBG-WEBHOOK
- id: pol-011
  technology: policy
  kind: howto
  question: How do I make Gatekeeper's admission webhook skip an entire namespace so that namespace keeps working even when
    Gatekeeper is down?
  answer: 'Start Gatekeeper with --exempt-namespace=<ns> (Helm: controllerManager.exemptNamespaces), keep the webhook namespaceSelector
    on admission.gatekeeper.sh/ignore DoesNotExist, and label the namespace admission.gatekeeper.sh/ignore. The API server
    then never calls the webhook for it; audit still runs.'
  source:
    repo: open-policy-agent/gatekeeper
    path: website/docs/exempt-namespaces.md
    commit: e492e24cb08cc557411b1658142d62d3e4dd1688
    url: 'https://open-policy-agent.github.io/gatekeeper/website/docs/exempt-namespaces'
  outOfScope: false
  status: pass
  expect:
  - 'kn:gatekeeper-enforcement#4'
- id: pol-012
  technology: policy
  kind: concept
  question: If all Gatekeeper webhook pods go down, do constraints still block bad resources by default? What is the trade-off
    of changing that?
  answer: 'By default the webhook uses failurePolicy Ignore, so while it is unreachable nothing is enforced and audit later
    reports what slipped in. Setting failurePolicy: Fail on the ValidatingWebhookConfiguration fails closed, but risks admission
    deadlocks and ties API availability to Gatekeeper.'
  source:
    repo: open-policy-agent/gatekeeper
    path: website/docs/failing-closed.md
    commit: e492e24cb08cc557411b1658142d62d3e4dd1688
    url: 'https://open-policy-agent.github.io/gatekeeper/website/docs/failing-closed'
  outOfScope: false
  status: miss
  gap: 'doc: Gatekeeper webhook failurePolicy Ignore vs Fail trade-off when webhook pods are down'
- id: pol-013
  technology: policy
  kind: error
  question: 'kubectl get validatingadmissionpolicy replica-check -o yaml shows status.typeChecking.expressionWarnings: apps/v1,
    Kind=Deployment: ERROR: <input>:1:7: undefined field ''replicas'' for the expression object.replicas > 1. The policy was
    still created. Should I fix it?'
  answer: Yes. The expression references a field that does not exist at that path; for a Deployment it is object.spec.replicas.
    Type-check results are advisory and do not block creation, but a broken expression errors at runtime and is then handled
    by the policy's failurePolicy.
  source:
    repo: kubernetes/website
    path: content/en/docs/reference/access-authn-authz/validating-admission-policy.md
    commit: ed70e311737a341574ed5758b7af24e3bba232cb
    url: 'https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/#type-checking'
  outOfScope: false
  status: pass
  expect:
  - 'kn:k8s-validating-admission-policy#4'
- id: pol-014
  technology: policy
  kind: howto
  question: How do I make pull requests fail when a Kubernetes manifest would violate our Kyverno policies, before anything
    reaches the cluster?
  answer: 'Run the Kyverno CLI in CI: kyverno apply policies/ -r resources/ checks manifests against the policy files, and
    kyverno test tests/ runs predefined test cases. A manifest that fails a validate policy fails the step and halts the pipeline.'
  source:
    repo: kyverno/website
    path: src/content/docs/docs/guides/testing-policies.md
    commit: b0131526d7d8d6e4fa80856adb75aa4d7b2f4c89
    url: 'https://kyverno.io/docs/guides/testing-policies/#continuous-integration'
  outOfScope: false
  status: pass
  expect:
  - 'kn:kyverno-troubleshooting#4'
- id: pol-015
  technology: policy
  kind: error
  question: 'My DaemonSet on OpenShift cannot create pods: unable to validate against any security context constraint: [provider
    restricted-v2: .spec.containers[0].securityContext.privileged: Invalid value: true: Privileged containers are not allowed].
    Should I just edit restricted-v2 to allow it?'
  answer: 'No, don''t modify default SCCs; customizations can be reset on upgrade. Grant the pod''s service account an SCC
    that permits privileged containers, such as privileged (oc adm policy add-scc-to-user privileged -z <sa>), or create a
    custom SCC. privileged: true alone doesn''t select the SCC.'
  source:
    repo: openshift/openshift-docs
    path: modules/security-context-constraints-about.adoc
    commit: 164957757519b01359989b533feac5ecab551530
    url: 'https://github.com/openshift/openshift-docs/blob/164957757519b01359989b533feac5ecab551530/modules/security-context-constraints-about.adoc'
  outOfScope: false
  status: miss
  expect:
  - DBG-SCC
  gap: 'rank: DBG-SCC / kn:ocp-scc#7 (never edit default SCCs, grant an SCC to the ServiceAccount) above the remove-privileged
    policy finding'
