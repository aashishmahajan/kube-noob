# Golden questions: policy. Original text written from the official documentation named in
# each item's source (license of the source docs: see the source repository); graded against kube-noob by an
# independent agent. status: pass (expect is the top finding), abstain (out of scope, no answer), miss (gap).
- id: pol-001
  technology: policy
  kind: error
  question: 'Our Deployment''s ReplicaSet cannot create pods in the payments namespace: pods "api-6f7d" is forbidden: violates
    PodSecurity "restricted:latest": allowPrivilegeEscalation != false (container "api" must set securityContext.allowPrivilegeEscalation=false),
    runAsNonRoot != true (pod or container "api" must set securityContext.runAsNonRoot=true). What do I fix in the pod spec?'
  answer: 'The namespace enforces the Restricted Pod Security Standard. On every container set allowPrivilegeEscalation: false
    and runAsNonRoot: true (or at pod level); also drop ALL capabilities and set seccompProfile.type to RuntimeDefault or
    Localhost. Or lower the namespace''s enforce level.'
  source:
    repo: kubernetes/website
    path: content/en/docs/concepts/security/pod-security-standards.md
    commit: ed70e311737a341574ed5758b7af24e3bba232cb
    url: 'https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted'
  outOfScope: false
  status: pass
  expect:
  - 'pod-security/restricted:latest'
- id: pol-002
  technology: policy
  kind: error
  question: 'kubectl create deploy web --image=nginx --replicas=8 fails with: deployments.apps "web" is forbidden: ValidatingAdmissionPolicy
    ''cap-replicas.corp.example'' with binding ''cap-replicas-prod'' denied request: failed expression: object.spec.replicas
    <= 5. Where does this message come from and how do I make it friendlier?'
  answer: The API server evaluated the policy's CEL validation, it returned false (8 > 5), and because the validation has
    no message the expression itself is shown. Reduce the replicas, or change the policy or binding. For clearer text set
    message or messageExpression on the validation.
  source:
    repo: kubernetes/website
    path: content/en/docs/reference/access-authn-authz/validating-admission-policy.md
    commit: ed70e311737a341574ed5758b7af24e3bba232cb
    url: 'https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/#message-expression'
  outOfScope: false
  status: miss
  expect:
  - DBG-VAP
  gap: 'rank: DBG-VAP (messageExpression/message advice and failed expression origin) above the generic policy finding'
- id: pol-003
  technology: policy
  kind: howto
  question: Before enforcing the baseline Pod Security Standard on all our existing namespaces, how can I see which running
    pods would violate it without changing anything?
  answer: 'Use a server-side dry run of the label command: kubectl label --dry-run=server --overwrite ns --all pod-security.kubernetes.io/enforce=baseline.
    The admission plugin still checks each existing pod and reports violations as warnings, but the label is not applied.'
  source:
    repo: kubernetes/website
    path: content/en/docs/tasks/configure-pod-container/enforce-standards-namespace-labels.md
    commit: ed70e311737a341574ed5758b7af24e3bba232cb
    url: 'https://kubernetes.io/docs/tasks/configure-pod-container/enforce-standards-namespace-labels/'
  outOfScope: false
  status: pass
  expect:
  - 'kn:k8s-pss#2'
- id: pol-004
  technology: policy
  kind: error
  question: 'Our CI job got: Error from server: error when creating "job.yaml": admission webhook "vpol.validate.kyverno.svc-fail"
    denied the request: Policy require-team-label failed: label ''team'' is required. One legacy migration Job cannot be relabeled.
    How do I exempt only that Job without editing the ValidatingPolicy?'
  answer: 'Create a PolicyException (policies.kyverno.io/v1) whose policyRefs name the ValidatingPolicy and whose CEL matchConditions
    select that Job. Exceptions are off by default: enable the enablePolicyException flag and set exceptionNamespace to the
    one namespace where they are permitted (or "*").'
  source:
    repo: kyverno/website
    path: src/content/docs/docs/guides/exceptions.md
    commit: b0131526d7d8d6e4fa80856adb75aa4d7b2f4c89
    url: 'https://kyverno.io/docs/guides/exceptions/'
  outOfScope: false
  status: miss
  expect:
  - 'kn:kyverno-troubleshooting#1'
  gap: 'rank: kn:kyverno-troubleshooting#1 (PolicyException) above the generic Kyverno finding that says to add labels'
- id: pol-005
  technology: policy
  kind: concept
  question: We set pod-security.kubernetes.io/enforce=restricted on a namespace. kubectl apply of a Deployment with a root
    container succeeds, yet no pods appear. Why is the Deployment itself accepted?
  answer: Pod Security Admission enforces only on Pod objects, not on workload resources such as Deployments. The Deployment
    is admitted, then the controller's pod creations are rejected. Audit and warn modes also check workload pod templates,
    which surfaces problems earlier.
  source:
    repo: kubernetes/website
    path: content/en/docs/concepts/security/pod-security-admission.md
    commit: ed70e311737a341574ed5758b7af24e3bba232cb
    url: 'https://kubernetes.io/docs/concepts/security/pod-security-admission/#workload-resources-and-pod-templates'
  outOfScope: false
  status: pass
  expect:
  - DBG-PSA
- id: pol-006
  technology: policy
  kind: error
  question: 'On OpenShift the ReplicaSet reports: Error creating: pods "billing-" is forbidden: unable to validate against
    any security context constraint: [provider restricted-v2: .spec.containers[0].securityContext.runAsUser: Invalid value:
    0: must be in the ranges: [1000650000, 1000659999]]. Our pod spec hard-codes runAsUser: 0. What is the clean fix?'
  answer: The SCC uses a UID-range strategy filled from the namespace's openshift.io/sa.scc.uid-range annotation, so UID 0
    is refused. Remove the hard-coded runAsUser so OpenShift assigns one, and make the image run as an arbitrary non-root
    user. Granting anyuid works but loosens security.
  source:
    repo: openshift/openshift-docs
    path: modules/security-context-constraints-pre-allocated-values.adoc
    commit: 164957757519b01359989b533feac5ecab551530
    url: 'https://github.com/openshift/openshift-docs/blob/164957757519b01359989b533feac5ecab551530/modules/security-context-constraints-pre-allocated-values.adoc'
  outOfScope: false
  status: pass
  expect:
  - openshift-scc/restricted-v2
- id: pol-007
  technology: policy
  kind: howto
  question: How can I trial a new ValidatingAdmissionPolicy in production so violations only surface as warnings and audit
    annotations, then switch it to blocking later?
  answer: 'Bind it with validationActions: [Warn, Audit] first (Deny and Warn cannot be combined), review the warnings and
    audit events, then change the binding to validationActions: [Deny]. The policy has no effect until a ValidatingAdmissionPolicyBinding
    exists.'
  source:
    repo: kubernetes/website
    path: content/en/docs/reference/access-authn-authz/validating-admission-policy.md
    commit: ed70e311737a341574ed5758b7af24e3bba232cb
    url: 'https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/#validation-actions'
  outOfScope: false
  status: miss
  expect:
  - 'kn:k8s-validating-admission-policy#3'
  gap: 'rank: kn:k8s-validating-admission-policy#3 (validationActions Warn/Audit then Deny) above the Pod Security dry-run
    section'
- id: pol-008
  technology: policy
  kind: error
  question: 'Creating a namespace fails with: Error from server ([ns-needs-owner] you must provide labels: {"owner"}): admission
    webhook "validation.gatekeeper.sh" denied the request: [ns-needs-owner] you must provide labels: {"owner"}. We want two
    weeks of visibility before blocking anything. What do we change?'
  answer: The constraint ns-needs-owner uses the default enforcementAction, deny. Set spec.enforcementAction to dryrun (violations
    appear in the constraint's status) or warn (the client gets a warning but the request passes), then switch back to deny
    later. Or simply add the owner label.
  source:
    repo: open-policy-agent/gatekeeper
    path: website/docs/violations.md
    commit: e492e24cb08cc557411b1658142d62d3e4dd1688
    url: 'https://open-policy-agent.github.io/gatekeeper/website/docs/violations'
  outOfScope: false
  status: miss
  gap: 'doc: Gatekeeper constraint enforcementAction dryrun and warn for audit-only rollout'
- id: pol-009
  technology: policy
  kind: out-of-scope
  question: 'My EKS worker node role gets AccessDenied for ecr:GetAuthorizationToken when pulling images. Which IAM policy
    statement do I need to attach?'
  answer: 'Outside this assistant''s scope: writing AWS IAM policies belongs to AWS IAM/EKS, not to Kubernetes admission policy
