- id: pol-017
  technology: policy
  kind: concept
  question: On OpenShift, if a pod is admitted by its SCC, is it automatically fine with Pod Security Admission? How do the
    two relate?
  answer: No. SCC admission and Pod Security Admission are independent controllers and a workload must satisfy both. The SCC
    controller can fill defaults (such as seccomp RuntimeDefault) and validates against the matching SCC; PSA separately validates
    the pod against the namespace's pod security standard.
  source:
    repo: openshift/openshift-docs
    path: modules/security-context-constraints-psa-coexistence.adoc
    commit: 164957757519b01359989b533feac5ecab551530
    url: 'https://github.com/openshift/openshift-docs/blob/164957757519b01359989b533feac5ecab551530/modules/security-context-constraints-psa-coexistence.adoc'
  outOfScope: false
  status: pass
  expect:
  - 'kn:ocp-scc#3'
- id: pol-018
  technology: policy
  kind: howto
  question: How do I force a Deployment's pods to be admitted under one particular SCC instead of whichever SCC wins on priority?
  answer: Put the openshift.io/required-scc annotation, set to the SCC name, on the pod template metadata (for a Deployment,
    spec.template.metadata.annotations). The SCC must exist and the user or service account needs use permission in that namespace,
    or admission fails.
  source:
    repo: openshift/openshift-docs
    path: modules/security-context-constraints-requiring.adoc
    commit: 164957757519b01359989b533feac5ecab551530
    url: 'https://github.com/openshift/openshift-docs/blob/164957757519b01359989b533feac5ecab551530/modules/security-context-constraints-requiring.adoc'
  outOfScope: false
  status: miss
  gap: 'rank: kn:ocp-scc#4 (openshift.io/required-scc on pod template) not in top3; only a pointer to it appears in the second
    finding'
