# Golden questions: rosa-hcp. Original text written from the official documentation named in
# each item's source (license of the source docs: see the source repository); graded against kube-noob by an
# independent agent. status: pass (expect is the top finding), abstain (out of scope, no answer), miss (gap).
# Every item is asked with platform: rosa-hcp, as an OpenShift or ROSA user's kube-noob is configured.
- id: rosa-001
  technology: rosa-hcp
  kind: error
  question: My ROSA HCP cluster failed during provisioning with OCM5011, unavailable capacity in the selected region. Do I
    need to change anything in IAM or the VPC?
  answer: No. OCM5011 means capacity was not available in the chosen region, which is not caused by your IAM or VPC settings.
    Retry the installation, or create the cluster in a different region.
  source:
    repo: openshift/openshift-docs
    path: modules/rosa-troubleshoot-hcp-install.adoc
    commit: 164957757519b01359989b533feac5ecab551530
    url: 'https://github.com/openshift/openshift-docs/blob/164957757519b01359989b533feac5ecab551530/modules/rosa-troubleshoot-hcp-install.adoc'
  outOfScope: false
  platform: rosa-hcp
  status: pass
  expect:
  - DBG-ROSA-OCM5011-CAPACITY
- id: rosa-002
  technology: rosa-hcp
  kind: error
  question: rosa create cluster on our own VPC fails with OCM5010, Failed to tag subnets for the cluster. What should I verify
    before retrying?
  answer: Check that the AWS permissions in use and the subnet configuration are correct. At least one private subnet must
    be tagged and, if you use public subnets, one public subnet too. Then retry the installation.
  source:
    repo: openshift/openshift-docs
    path: modules/rosa-troubleshoot-hcp-install.adoc
    commit: 164957757519b01359989b533feac5ecab551530
    url: 'https://github.com/openshift/openshift-docs/blob/164957757519b01359989b533feac5ecab551530/modules/rosa-troubleshoot-hcp-install.adoc'
  outOfScope: false
  platform: rosa-hcp
  status: pass
  expect:
  - DBG-ROSA-OCM5010-SUBNET-TAGS
- id: rosa-003
  technology: rosa-hcp
  kind: error
  question: 'First ROSA cluster in this AWS account and the install dies with: Error creating network Load Balancer: AccessDenied
    ... not authorized to perform: iam:CreateServiceLinkedRole. How do I fix it?'
  answer: The account has no Elastic Load Balancing service-linked role yet. Check it with `aws iam get-role --role-name AWSServiceRoleForElasticLoadBalancing`
    and, if absent, run `aws iam create-service-linked-role --aws-service-name elasticloadbalancing.amazonaws.com`. Needed
    once per account.
  source:
    repo: openshift/openshift-docs
    path: modules/rosa-troubleshooting-elb-service-role.adoc
    commit: 164957757519b01359989b533feac5ecab551530
    url: 'https://github.com/openshift/openshift-docs/blob/164957757519b01359989b533feac5ecab551530/modules/rosa-troubleshooting-elb-service-role.adoc'
  outOfScope: false
  platform: rosa-hcp
  status: pass
  expect:
  - DBG-ROSA-ELB-SERVICE-ROLE
- id: rosa-004
  technology: rosa-hcp
  kind: error
  question: Deleting our ROSA HCP cluster in the console fails with CLUSTERS-MGMT-400 ... sts_user_role is not linked to your
    account. Someone tidied up IAM roles last week. How do I get unstuck?
  answer: The user-role was unlinked or deleted. Run `rosa create user-role` to recreate and link it (look for the successfully
    linked role ARN message), then retry the cluster deletion.
