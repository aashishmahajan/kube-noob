# Golden questions: rhacs. Original text written from the official documentation named in
# each item's source (license of the source docs: see the source repository); graded against kube-noob by an
# independent agent. status: pass (expect is the top finding), abstain (out of scope, no answer), miss (gap).
- id: rhacs-001
  technology: rhacs
  kind: error
  question: 'Our deploy job failed with: Error from server (Failed currently enforced policies from RHACS): error when creating
    "web.yaml": admission webhook "policyeval.stackrox.io" denied the request. It is a production hotfix that has to ship
    now. What are my options?'
  answer: 'The admission controller rejected it: the workload violates a deploy-time policy with enforcement on. Best fix:
    make it compliant. In an emergency add the admission.stackrox.io/break-glass annotation (value = ticket ref) if bypass
    is enabled; it raises an Emergency Deployment Annotation violation.'
  source:
    repo: openshift/openshift-docs
    path: modules/bypass-admission-controller-enforcement.adoc
    commit: 801ccd0dfd1f73aed72188c8c960de5c5bc85cd6
    url: 'https://github.com/openshift/openshift-docs/blob/801ccd0dfd1f73aed72188c8c960de5c5bc85cd6/modules/bypass-admission-controller-enforcement.adoc'
  outOfScope: false
  status: miss
  expect:
  - DBG-STACKROX-ADMISSION
  gap: 'rank: DBG-STACKROX-ADMISSION playbook should outrank the generic rhacs policy-source finding'
- id: rhacs-002
  technology: rhacs
  kind: howto
  question: How do I run an RHACS policy check on our Kubernetes manifests in a CI job and get the results as JUnit XML for
    the pipeline's test report?
  answer: 'Export ROX_ENDPOINT as Central''s host:port and authenticate with an API token, then run roxctl deployment check
    --file=<manifest.yaml> -o junit. Use --junit-suite-name to name the suite. Without -o the output is a table; json and
    csv are also available.'
  source:
    repo: openshift/openshift-docs
    path: modules/configuring-output-format.adoc
    commit: 801ccd0dfd1f73aed72188c8c960de5c5bc85cd6
    url: 'https://github.com/openshift/openshift-docs/blob/801ccd0dfd1f73aed72188c8c960de5c5bc85cd6/modules/configuring-output-format.adoc'
  outOfScope: false
  status: pass
  expect:
  - 'kn:rhacs-roxctl-ci#1'
- id: rhacs-003
  technology: rhacs
  kind: error
  question: 'Images from our private registry show no CVE data in RHACS, and the image page says "Failed to retrieve metadata
    from the registry". Central sits in a locked-down network segment. What does this mean and what should I check?'
  answer: 'Scanner could not reach the registry to read image metadata: usually a firewall or network block, or an authentication
    problem. Check network access from Central/Scanner to the registry and add a registry integration with valid credentials
    for that private repo; Central''s pod logs show the cause.'
  source:
    repo: openshift/openshift-docs
    path: modules/common-scanner-warning-messages.adoc
    commit: 801ccd0dfd1f73aed72188c8c960de5c5bc85cd6
    url: 'https://github.com/openshift/openshift-docs/blob/801ccd0dfd1f73aed72188c8c960de5c5bc85cd6/modules/common-scanner-warning-messages.adoc'
  outOfScope: false
  status: pass
  expect:
  - DBG-RHACS-SCANNER-REGISTRY
- id: rhacs-004
  technology: rhacs
  kind: concept
  question: 'What is the practical difference between RHACS "hard" and "soft" policy enforcement, and which component performs
    each?'
  answer: 'Hard enforcement is done by the admission controller through a validating webhook: the API server rejects creating
    or updating a workload that violates an enforced policy. Soft enforcement is done by Sensor, which scales the violating
    workload''s pods down through the Kubernetes API.'
  source:
    repo: openshift/openshift-docs
    path: modules/policy-enforcement-about.adoc
    commit: 801ccd0dfd1f73aed72188c8c960de5c5bc85cd6
    url: 'https://github.com/openshift/openshift-docs/blob/801ccd0dfd1f73aed72188c8c960de5c5bc85cd6/modules/policy-enforcement-about.adoc'
  outOfScope: false
  status: pass
  expect:
  - 'kn:rhacs-enforcement#1'
- id: rhacs-005
  technology: rhacs
  kind: error
  question: 'After we switched RHACS admission control to fail closed, applying manifests sometimes dies with: Internal error
    occurred: failed calling webhook "policyeval.stackrox.io": failed to call webhook: Post "https://admission-control.stackrox.svc:443/validate?timeout=10s":
    context deadline exceeded. We would rather let requests through when RHACS is slow or down. What do I change?'
  answer: 'Set the admission controller failure policy back to fail open. Operator: set spec.admissionControl.failurePolicy
    to Ignore in the SecuredCluster CR (Fail blocks). Helm: set admissionControl.failurePolicy to Ignore in values-public.yaml
    and run helm upgrade with your values files.'
  source:
    repo: openshift/openshift-docs
    path: modules/admission-controller-failure-policy-changing.adoc
    commit: 801ccd0dfd1f73aed72188c8c960de5c5bc85cd6
    url: 'https://github.com/openshift/openshift-docs/blob/801ccd0dfd1f73aed72188c8c960de5c5bc85cd6/modules/admission-controller-failure-policy-changing.adoc'
  outOfScope: false
  status: pass
  expect:
  - DBG-RHACS-WEBHOOK-FAILURE-POLICY
- id: rhacs-006
  technology: rhacs
  kind: howto
  question: How do I stop one RHACS deploy-time policy from firing in every namespace whose name starts with test-?
  answer: 'Edit the policy''s resource scope and add an exclusion under Excluded resources: a namespace entry written as an
    RE2 regex such as test-.*. Cluster and namespace scoping only affect deploy-time and runtime evaluation, not build-stage
    image checks.'
  source:
    repo: openshift/openshift-docs
    path: modules/configure-policy-scope.adoc
    commit: 801ccd0dfd1f73aed72188c8c960de5c5bc85cd6
    url: 'https://github.com/openshift/openshift-docs/blob/801ccd0dfd1f73aed72188c8c960de5c5bc85cd6/modules/configure-policy-scope.adoc'
  outOfScope: false
  status: miss
  expect:
  - 'kn:rhacs-policy-rules-scope#3'
  gap: 'rank: kn:rhacs-policy-rules-scope#3 exclusion doc should outrank the roxctl deployment check doc'
- id: rhacs-007
  technology: rhacs
  kind: error
  question: 'A legacy image in RHACS shows "CVE DATA MAY BE INACCURATE" together with "Stale OS CVE data". The base image
    is Debian 9. Is Scanner misbehaving?'
  answer: No. The warning means the image's base OS is end of life, so the vendor no longer updates its vulnerability data
    and the OS-package CVE results may be incomplete. Rebuild on a supported base image.
  source:
    repo: openshift/openshift-docs
    path: modules/common-scanner-warning-messages.adoc
    commit: 801ccd0dfd1f73aed72188c8c960de5c5bc85cd6
    url: 'https://github.com/openshift/openshift-docs/blob/801ccd0dfd1f73aed72188c8c960de5c5bc85cd6/modules/common-scanner-warning-messages.adoc'
  outOfScope: false
  status: pass
  expect:
  - DBG-RHACS-SCANNER-CVE-DATA
