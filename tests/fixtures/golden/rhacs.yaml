- id: rhacs-009
  technology: rhacs
  kind: error
  question: 'New secured cluster, Collector pods keep restarting. Their logs end with "Connected to Sensor? false" followed
    by FATAL Unable to connect to Sensor at ''sensor.rhacs.svc:443''. Sensor lives in a custom namespace. How do I troubleshoot?'
  answer: Either Sensor is unhealthy or Collector points at the wrong address. Read GRPC_SERVER from the collector pod's env
    and compare it with the sensor Service and port, and confirm the Sensor pod is Running 1/1. Fix whichever is wrong, then
    delete the collector pods so they restart.
  source:
    repo: openshift/openshift-docs
    path: modules/unable-to-connect-to-the-sensor.adoc
    commit: 801ccd0dfd1f73aed72188c8c960de5c5bc85cd6
    url: 'https://github.com/openshift/openshift-docs/blob/801ccd0dfd1f73aed72188c8c960de5c5bc85cd6/modules/unable-to-connect-to-the-sensor.adoc'
  outOfScope: false
  status: pass
  expect:
  - DBG-RHACS-COLLECTOR-SENSOR
- id: rhacs-010
  technology: rhacs
  kind: howto
  question: 'The default "Privileged Container" policy is enabled in RHACS and generates violations, yet kubectl apply of
    a privileged pod still goes through. How do I make it actually block?'
  answer: Enabled only means it reports violations. Edit the policy to Inform and enforce, and turn on deploy-time enforcement
    for it. Also make sure the cluster's admission controller enforcement behavior is set to enforce policies, since the admission
    controller does the blocking.
  source:
    repo: openshift/openshift-docs
    path: modules/policy-enforcement-hard.adoc
    commit: 801ccd0dfd1f73aed72188c8c960de5c5bc85cd6
    url: 'https://github.com/openshift/openshift-docs/blob/801ccd0dfd1f73aed72188c8c960de5c5bc85cd6/modules/policy-enforcement-hard.adoc'
  outOfScope: false
  status: pass
  expect:
  - 'kn:rhacs-enforcement#2'
- id: rhacs-011
  technology: rhacs
  kind: concept
  question: In a custom RHACS policy with two rule sections, each holding several criteria, when does a deployment count as
    violating it?
  answer: 'Rules are ORed and the criteria inside one rule are ANDed: a violation occurs if at least one rule has all of its
    criteria satisfied. Most criteria describe the bad condition (many have NOT forms); a few describe required good state,
    such as capabilities that must be dropped.'
  source:
    repo: openshift/openshift-docs
    path: modules/policy-structure.adoc
    commit: 801ccd0dfd1f73aed72188c8c960de5c5bc85cd6
    url: 'https://github.com/openshift/openshift-docs/blob/801ccd0dfd1f73aed72188c8c960de5c5bc85cd6/modules/policy-structure.adoc'
  outOfScope: false
  status: pass
  expect:
  - 'kn:rhacs-policy-rules-scope#1'
