- id: rhacs-014
  technology: rhacs
  kind: howto
  question: We bootstrap secured clusters with roxctl sensor generate. How do I generate a bundle whose admission controller
    does not enforce policies?
  answer: Pass --admission-controller-enforcement=false to roxctl sensor generate. The default is true, which makes the admission
    controller reject create or update requests that violate an enabled policy; false turns that enforcement off.
  source:
    repo: openshift/openshift-docs
    path: modules/roxctl-sensor-generate-options.adoc
    commit: 801ccd0dfd1f73aed72188c8c960de5c5bc85cd6
    url: 'https://github.com/openshift/openshift-docs/blob/801ccd0dfd1f73aed72188c8c960de5c5bc85cd6/modules/roxctl-sensor-generate-options.adoc'
  outOfScope: false
  status: pass
  expect:
  - 'kn:rhacs-enforcement#6'
- id: rhacs-015
  technology: rhacs
  kind: error
  question: 'After migrating Central to PostgreSQL, the log says: Failed to create collections for scope prod-eu: Unsupported
    operator NOT_IN in scope''s label selectors. Our vulnerability report for that scope is empty now. What happened?'
  answer: The migration only converts access scopes whose label selectors use the IN operator; NOT_IN, EXISTS and NOT_EXISTS
    are not migrated. Build a replacement collection by hand with the same selection and point each affected report configuration
    at it; until then those reports stay broken.
  source:
    repo: openshift/openshift-docs
    path: modules/migrate-scope-collections.adoc
    commit: 801ccd0dfd1f73aed72188c8c960de5c5bc85cd6
    url: 'https://github.com/openshift/openshift-docs/blob/801ccd0dfd1f73aed72188c8c960de5c5bc85cd6/modules/migrate-scope-collections.adoc'
  outOfScope: false
  status: pass
  expect:
  - 'kn:rhacs-secured-cluster-troubleshooting#6'
- id: rhacs-016
  technology: rhacs
  kind: concept
  question: In a secured cluster, what do Sensor, the admission controller, Collector and Scanner V4 each do?
  answer: Sensor watches the cluster API and Collector events, raises deploy/runtime violations and handles cluster actions.
    The admission controller blocks workloads that violate enforced policies. Collector monitors container runtime and network
    activity on nodes, feeding Sensor. Scanner V4 indexes images.
  source:
    repo: openshift/openshift-docs
    path: modules/acs-secured-cluster-services-overview.adoc
    commit: 801ccd0dfd1f73aed72188c8c960de5c5bc85cd6
    url: 'https://github.com/openshift/openshift-docs/blob/801ccd0dfd1f73aed72188c8c960de5c5bc85cd6/modules/acs-secured-cluster-services-overview.adoc'
  outOfScope: false
  status: pass
  expect:
  - 'kn:rhacs-secured-cluster-troubleshooting#1'
- id: rhacs-017
  technology: rhacs
  kind: error
  question: '`roxctl image check --image registry.corp/app:1.4.2` in CI exits 1 with "ERROR: failed policies found: 1 policies
    violated that are failing the check". The table lists "Fixable Severity at least Important" under BREAKS BUILD. We never
    touched that policy. Why does it fail the build?'
  answer: It is a default policy for build and deploy, enabled and shipped with build enforcement (it fails the build). It
    triggers on fixable vulnerabilities rated Important or worse. Update the affected packages or base image; if you accept
    the risk, drop its build enforcement or exclude the image.
  source:
    repo: stackrox/stackrox
    path: pkg/defaults/policies/files/severity_important.json
    commit: 69fc953f424bf243362dfaab47c4a1bad55fd83b
    url: 'https://github.com/stackrox/stackrox/blob/69fc953f424bf243362dfaab47c4a1bad55fd83b/pkg/defaults/policies/files/severity_important.json'
  outOfScope: false
  status: pass
  expect:
  - DBG-RHACS-IMAGE-CHECK-FAILED
- id: rhacs-018
  technology: rhacs
  kind: howto
  question: roxctl image check keeps returning old scan results for an image we just rebuilt under the same tag. How do I
    make Central fetch fresh data?
  answer: Add --force. It bypasses Central's cache so image metadata and scan results are pulled again from the registry and
    scanner. The API token needs read and write access to the Image resource; the default Continuous Integration role already
    has it.
  source:
    repo: openshift/openshift-docs
    path: modules/checking-images.adoc
    commit: 801ccd0dfd1f73aed72188c8c960de5c5bc85cd6
    url: 'https://github.com/openshift/openshift-docs/blob/801ccd0dfd1f73aed72188c8c960de5c5bc85cd6/modules/checking-images.adoc'
  outOfScope: false
  status: pass
  expect:
  - 'kn:rhacs-roxctl-ci#4'
