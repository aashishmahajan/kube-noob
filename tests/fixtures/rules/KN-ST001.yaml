rule: KN-ST001
platform: rosa-hcp
version: '4.20'
good: |
  apiVersion: v1
  kind: PersistentVolumeClaim
  metadata: {name: data, namespace: shop}
  spec:
    accessModes: [ReadWriteOnce]
    storageClassName: gp3-csi
    resources: {requests: {storage: 1Gi}}
bad: |
  apiVersion: v1
  kind: PersistentVolumeClaim
  metadata: {name: data, namespace: shop}
  spec:
    accessModes: [ReadWriteMany]
    storageClassName: gp3-csi
    resources: {requests: {storage: 1Gi}}
