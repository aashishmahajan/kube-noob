rule: KN-S035
# The APIServer config resource only exists on OpenShift; on kubernetes this rule has nothing to read.
platform: openshift
version: '4.20'
good: |
  apiVersion: config.openshift.io/v1
  kind: APIServer
  metadata: {name: cluster}
  spec:
    audit:
      profile: WriteRequestBodies
      customRules:
      - {group: 'system:authenticated:oauth', profile: AllRequestBodies}
bad: |
  apiVersion: config.openshift.io/v1
  kind: APIServer
  metadata: {name: cluster}
  spec:
    audit:
      profile: Default
      customRules:
      - {group: 'system:serviceaccounts:prod', profile: None}
