rule: KN-V002
platform: openshift
version: '4.20'
good: |
  apiVersion: route.openshift.io/v1
  kind: Route
  metadata: {name: web, namespace: shop}
  spec:
    to: {kind: Service, name: web}
    tls: {termination: edge}
bad: |
  apiVersion: apps.openshift.io/v1
  kind: Route
  metadata: {name: web, namespace: shop}
  spec:
    to: {kind: Service, name: web}
