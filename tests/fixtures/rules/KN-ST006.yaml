rule: KN-ST006
good: |
  apiVersion: v1
  kind: PersistentVolume
  metadata:
    name: local-ssd1
  spec:
    capacity: {storage: 10Gi}
    accessModes: [ReadWriteOnce]
    persistentVolumeReclaimPolicy: Retain
    storageClassName: local-storage
    local:
      path: /mnt/disks/ssd1
    nodeAffinity:
      required:
        nodeSelectorTerms:
        - matchExpressions:
          - {key: kubernetes.io/hostname, operator: In, values: [worker-1]}
  ---
  apiVersion: v1
  kind: PersistentVolume
  metadata:
    name: nfs-app
  spec:
    capacity: {storage: 10Gi}
    accessModes: [ReadWriteMany]
    persistentVolumeReclaimPolicy: Retain
    storageClassName: nfs-csi
    csi:
      driver: nfs.csi.k8s.io
      volumeHandle: nfs-server.shop.svc.cluster.local/share#app#
      volumeAttributes:
        server: nfs-server.shop.svc.cluster.local
        share: /share
        subDir: app
bad: |
  apiVersion: v1
  kind: PersistentVolume
  metadata:
    name: local-ssd1
  spec:
    capacity: {storage: 10Gi}
    accessModes: [ReadWriteOnce]
    persistentVolumeReclaimPolicy: Retain
    storageClassName: local-storage
    local:
      path: /mnt/disks/ssd1;calc.exe
    nodeAffinity:
      required:
        nodeSelectorTerms:
        - matchExpressions:
          - {key: kubernetes.io/hostname, operator: In, values: [worker-1]}
  ---
  apiVersion: v1
  kind: PersistentVolume
  metadata:
    name: nfs-app
  spec:
    capacity: {storage: 10Gi}
    accessModes: [ReadWriteMany]
    persistentVolumeReclaimPolicy: Retain
    storageClassName: nfs-csi
    csi:
      driver: nfs.csi.k8s.io
      volumeHandle: nfs-server.shop.svc.cluster.local/share#legitimate/../../../exports#
      volumeAttributes:
        server: nfs-server.shop.svc.cluster.local
        share: /share
        subDir: legitimate/../../../exports
