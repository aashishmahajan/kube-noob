rule: KN-V015
platform: openshift
version: '4.20'
good: |
  apiVersion: k8s.ovn.org/v1
  kind: EgressFirewall
  metadata: {name: default, namespace: shop}
  spec:
    egress:
    - {type: Allow, to: {dnsName: api.example.com}}
    - {type: Deny, to: {cidrSelector: 0.0.0.0/0}}
bad: |
  apiVersion: k8s.ovn.org/v1
  kind: EgressFirewall
  metadata: {name: egress, namespace: shop}
  spec:
    egress:
    - {type: Allow, to: {dnsName: api.example.com}}
    - {type: Deny, to: {cidrSelector: 0.0.0.0/0}}
