rule: KN-V020
good: |
  apiVersion: apps/v1
  kind: Deployment
  metadata: {name: trainer, namespace: ml}
  spec:
    replicas: 1
    selector: {matchLabels: {app: trainer}}
    template:
      metadata: {labels: {app: trainer}}
      spec:
        resourceClaims:
        - name: gpu
          resourceClaimTemplateName: single-gpu
        containers:
        - name: train
          image: registry.example.com/trainer@sha256:3f1a8c2e9b7d4a6f05e8c1b3d9a7f2e4c6b8d0a2f4e6c8b0d2a4f6e8c0b2d4a6
          resources:
            claims:
            - name: gpu
bad: |
