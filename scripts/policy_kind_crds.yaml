# Minimal stand-ins for the OpenShift and OVN-Kubernetes APIs the generated policies match, so a kind cluster can
# admit (server-side dry-run) the rule fixtures that use them. Schemas keep every field: the admission policies, not
# these CRDs, are under test (scripts/policy_kind_test.py).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: routes.route.openshift.io
spec:
  group: route.openshift.io
  scope: Namespaced
  names: {plural: routes, singular: route, kind: Route}
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
