{{- if .Values.networkPolicy.enabled }}
{{- if not (or .Values.networkPolicy.allowSameNamespace .Values.networkPolicy.allowRouter .Values.networkPolicy.allowIngressNamespace) }}
{{- fail "networkPolicy needs at least one allowed source (allowSameNamespace, allowRouter or allowIngressNamespace); an empty 'from' would admit every source" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kube-noob.fullname" . }}
  labels: {{- include "kube-noob.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "kube-noob.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress{{ if .Values.networkPolicy.egress.enabled }}, Egress{{ end }}]
  ingress:
    - ports:
        - {protocol: TCP, port: {{ .Values.service.port }}}
      from:
        {{- if .Values.networkPolicy.allowSameNamespace }}
        - podSelector: {}
        {{- end }}
        {{- if .Values.networkPolicy.allowRouter }}
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
        {{- end }}
        {{- with .Values.networkPolicy.allowIngressNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.dnsNamespace }}
      ports:
        - {protocol: UDP, port: {{ .Values.networkPolicy.egress.dnsPort }}}
        - {protocol: TCP, port: {{ .Values.networkPolicy.egress.dnsPort }}}
    {{- if eq (include "kube-noob.memorySource" .) "git" }}
    - to:
        {{- range .Values.memory.git.egressCIDRs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ include "kube-noob.memoryGitPort" . }}}
    {{- end }}
    {{- if .Values.config.clusterEnabled }}
    {{- if not .Values.networkPolicy.egress.apiServerCIDRs }}
    {{- fail "config.clusterEnabled requires networkPolicy.egress.apiServerCIDRs (or networkPolicy.egress.enabled=false)" }}
    {{- end }}
    - to:
        {{- range .Values.networkPolicy.egress.apiServerCIDRs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.networkPolicy.egress.apiServerPort }}}
        - {protocol: TCP, port: 443}
    {{- end }}
    {{- if .Values.rhacs.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.rhacs.centralNamespace | quote }}
          podSelector:
            matchLabels: {app: central}
      ports:
        - {protocol: TCP, port: 8443}
    {{- if and .Values.rhacs.egressCIDRs (not (.Values.config.offline | default false)) }}
    - to:
        {{- range .Values.rhacs.egressCIDRs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: 443}
    {{- end }}
    {{- end }}
    {{- if and (or .Values.config.webEnabled .Values.jira.sync.enabled) (not (.Values.config.offline | default false)) }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{- toYaml .Values.networkPolicy.egress.webExceptCIDRs | nindent 14 }}
      ports:
        - {protocol: TCP, port: 443}
    {{- with .Values.networkPolicy.egress.webProxy }}
    {{- if .cidr }}
    - to:
        - ipBlock: {cidr: {{ .cidr }}}
      ports:
        - {protocol: TCP, port: {{ .port }}}
    {{- end }}
    {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
