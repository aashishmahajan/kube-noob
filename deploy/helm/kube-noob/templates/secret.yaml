{{- if and (not .Values.auth.existingSecret) (not .Values.auth.allowUnauthenticated) }}
{{- /* No token Secret given: generate a random 48-character token once and keep it across upgrades. */}}
{{- $name := include "kube-noob.tokenSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "kube-noob.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ if and $existing $existing.data (index $existing.data "token") }}{{ index $existing.data "token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
