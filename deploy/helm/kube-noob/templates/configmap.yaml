apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kube-noob.fullname" . }}
  labels: {{- include "kube-noob.labels" . | nindent 4 }}
data:
  config.yaml: |
    offline: {{ .Values.config.offline | default false }}
    webEnabled: {{ .Values.config.webEnabled }}
    {{- with .Values.config.allowedDomains }}
    web:
      allowedDomains: {{- toYaml . | nindent 8 }}
    {{- end }}
    defaultPlatform: {{ .Values.config.defaultPlatform }}
    llm:
      provider: none          # the server never calls a model; the client (Lightspeed, Claude) does the talking
    cluster:
      enabled: {{ .Values.config.clusterEnabled }}
      backend: in-cluster
    watch:
      enabled: {{ .Values.watch.enabled }}
      intervalSeconds: {{ .Values.watch.intervalSeconds }}
      namespaces:
        - {{ .Release.Namespace | quote }}
        {{- range .Values.rbac.namespaces }}
        - {{ . | quote }}
        {{- end }}
    posture:
      reportEnabled: {{ .Values.posture.report.enabled }}
      keep: {{ .Values.posture.report.keep }}
      {{- if ne .Values.rbac.scope "cluster" }}
      namespaces:
        - {{ .Release.Namespace | quote }}
        {{- range .Values.rbac.namespaces }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
    rhacs:
      enabled: {{ .Values.rhacs.enabled }}
      {{- if .Values.rhacs.enabled }}
      endpoint: {{ .Values.rhacs.endpoint | quote }}
      maxPolicies: {{ .Values.rhacs.maxPolicies }}
      {{- if .Values.rhacs.caConfigMap.name }}
      caFile: /etc/kube-noob-rhacs-ca/{{ .Values.rhacs.caConfigMap.key }}
      {{- end }}
      {{- end }}
    probe:
      enabled: {{ .Values.probe.enabled }}
    dryRun:
      enabled: {{ .Values.dryRun.enabled }}
    itsm:
      writeEnabled: {{ .Values.itsm.writeEnabled }}
    notify:
      enabled: {{ .Values.notify.enabled }}
    gate:
      enabled: {{ .Values.gate.enabled }}
    {{- if .Values.mustGather.pvc.claimName }}
    mustGather:
      allowedDir: /srv/kube-noob/must-gather
    {{- end }}
    {{- if ne (include "kube-noob.memorySource" .) "none" }}
    memory:
      paths: [/srv/kube-noob/memory]
    {{- end }}
    jira:
      syncEnabled: {{ .Values.jira.sync.enabled }}
      projects: {{ .Values.jira.sync.projects | quote }}
      intervalHours: {{ .Values.jira.sync.intervalHours }}
      maxRequests: {{ .Values.jira.sync.maxRequests }}
    server:
      host: 0.0.0.0
      port: {{ .Values.service.port }}
      authTokenEnv: KUBE_NOOB_HTTP_TOKEN
      # Host-header allowlist (DNS-rebinding protection): Service DNS names, Route/Ingress host, loopback.
      allowedHosts:
        {{- $svc := include "kube-noob.fullname" . }}
        {{- range (list $svc (printf "%s.%s" $svc .Release.Namespace) (printf "%s.%s.svc" $svc .Release.Namespace) (printf "%s.%s.svc.cluster.local" $svc .Release.Namespace) "127.0.0.1" "localhost") }}
        - {{ . | quote }}
        - {{ printf "%s:*" . | quote }}
        {{- end }}
        {{- with .Values.route.host }}
        - {{ . | quote }}
        {{- end }}
        {{- with .Values.ingress.host }}
        - {{ . | quote }}
        {{- end }}
