{{- define "kube-noob.readRules" -}}
rules:
  # Read-only allowlist mirrored from kube_noob.debug.cluster.ALLOWED_RESOURCES. No Secrets, ever.
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, events, configmaps, persistentvolumeclaims, resourcequotas,
                limitranges, serviceaccounts{{ if .cluster }}, persistentvolumes, nodes, namespaces{{ end }}]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [get, list, watch]
  - apiGroups: [k8s.ovn.org]
    resources: [egressfirewalls]
    verbs: [get, list, watch]
  - apiGroups: [platform.stackrox.io]
    resources: [centrals, securedclusters]
    verbs: [get, list, watch]
  - apiGroups: [apps.openshift.io]
    resources: [deploymentconfigs]
    verbs: [get, list, watch]
  # Who may do what (no credentials): the attack-path scan reads RBAC; Secrets stay out.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings{{ if .cluster }}, clusterroles, clusterrolebindings{{ end }}]
    verbs: [get, list, watch]
{{- if .cluster }}
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [config.openshift.io]
    resources: [clusteroperators, clusterversions]
    verbs: [get, list, watch]
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    verbs: [get, list, watch]
{{- end }}
{{- end -}}

{{- if .Values.config.clusterEnabled }}
{{- $name := printf "%s-read" (include "kube-noob.fullname" .) }}
{{- $sa := include "kube-noob.fullname" . }}
{{- if eq .Values.rbac.scope "cluster" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels: {{- include "kube-noob.labels" . | nindent 4 }}
{{ include "kube-noob.readRules" (dict "cluster" true) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels: {{- include "kube-noob.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}}
subjects:
  - {kind: ServiceAccount, name: {{ $sa }}, namespace: {{ .Release.Namespace }}}
{{- else }}
{{- /* Namespace scope (default): read only the release namespace plus rbac.namespaces, never cluster-wide. */}}
{{- range $ns := (concat (list .Release.Namespace) .Values.rbac.namespaces | uniq) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels: {{- include "kube-noob.labels" $ | nindent 4 }}
{{ include "kube-noob.readRules" (dict "cluster" false) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels: {{- include "kube-noob.labels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}}
subjects:
  - {kind: ServiceAccount, name: {{ $sa }}, namespace: {{ $.Release.Namespace }}}
{{- end }}
{{- end }}
{{- end }}
