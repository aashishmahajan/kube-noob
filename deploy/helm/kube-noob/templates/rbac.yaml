{{- define "kube-noob.readRules" -}}
rules:
  # Read-only allowlist mirrored from kube_noob.debug.cluster.ALLOWED_RESOURCES. No Secrets, ever.
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, events, configmaps, persistentvolumeclaims, resourcequotas,
                limitranges, serviceaccounts{{ if .cluster }}, persistentvolumes, nodes, namespaces{{ end }}]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [get, list]
  - apiGroups: [k8s.ovn.org]
    resources: [egressfirewalls]
    verbs: [get, list]
  - apiGroups: [platform.stackrox.io]
    resources: [centrals, securedclusters]
    verbs: [get, list]
  - apiGroups: [apps.openshift.io]
    resources: [deploymentconfigs]
    verbs: [get, list]
  # AI workload CRDs. Their pod specs are embedded (a KServe component, a Ray head or worker group) rather than
  # in `spec.template.spec`, so without these grants the audit and the attack-path scan see no pods at all for
  # them and report them clean. Namespaced, read-only; a cluster without the operator answers 404, which both
  # report as not read. Groups and versions are the published CRDs: serving.kserve.io, ray.io.
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    verbs: [get, list]
  - apiGroups: [ray.io]
    resources: [rayclusters, rayservices, rayjobs]
    verbs: [get, list]
  # Who may do what (no credentials): the attack-path scan reads RBAC; Secrets stay out.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings{{ if .cluster }}, clusterroles, clusterrolebindings{{ end }}]
    verbs: [get, list]
{{- if .cluster }}
  # The cluster-scoped network policy tiers, read for `policy reach --live`: the v1alpha1 pair this evaluator
  # understands, and ClusterNetworkPolicy (v1alpha2, the API upstream is actively developing), which it reads so
  # it can say the kind was present and not evaluated rather than answering as if it were absent. Cluster-scoped,
  # so the grant only exists in the ClusterRole; a cluster without the CRDs answers 404 and the check says so.
  - apiGroups: [policy.networking.k8s.io]
    resources: [clusternetworkpolicies, adminnetworkpolicies, baselineadminnetworkpolicies]
    verbs: [get, list]
  # Cilium clusterwide and Calico GlobalNetworkPolicy. Cluster-scoped, recorded, not parsed. The grant exists
  # only on the ClusterRole. A cluster without the CRD answers 404. Groups are the published CRDs
  # (cilium.io/v2, crd.projectcalico.org/v1), not a guess.
  - apiGroups: [cilium.io]
    resources: [ciliumclusterwidenetworkpolicies]
    verbs: [get, list]
  # `clusterinformations` carries Calico's own version, which decides whether this cluster still enforces
  # AdminNetworkPolicy at all (Calico stopped at 3.32). Read-only, cluster-scoped, and no personal data: the
  # object holds a version, a variant, a cluster type and a generated GUID. The comment sits above the rule
  # rather than inside it because scripts/safety_contract.py parses these rules as one expression, and a comment
  # between `apiGroups:` and `resources:` makes it refuse to prove anything (which is the right refusal).
  - apiGroups: [crd.projectcalico.org]
    resources: [globalnetworkpolicies, clusterinformations]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
  - apiGroups: [config.openshift.io]
    resources: [apiservers, clusteroperators, clusterversions]
    verbs: [get, list]
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    verbs: [get, list]
{{- end }}
{{- end -}}

{{- if .Values.config.clusterEnabled }}
{{- $name := printf "%s-read" (include "kube-noob.fullname" .) }}
{{- $sa := include "kube-noob.fullname" . }}
{{- if eq .Values.rbac.scope "cluster" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels: {{- include "kube-noob.labels" . | nindent 4 }}
{{ include "kube-noob.readRules" (dict "cluster" true) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels: {{- include "kube-noob.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}}
subjects:
  - {kind: ServiceAccount, name: {{ $sa }}, namespace: {{ .Release.Namespace }}}
{{- else }}
{{- /* Namespace scope (default): read only the release namespace plus rbac.namespaces, never cluster-wide. */}}
{{- range $ns := (concat (list .Release.Namespace) .Values.rbac.namespaces | uniq) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels: {{- include "kube-noob.labels" $ | nindent 4 }}
{{ include "kube-noob.readRules" (dict "cluster" false) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels: {{- include "kube-noob.labels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}}
subjects:
  - {kind: ServiceAccount, name: {{ $sa }}, namespace: {{ $.Release.Namespace }}}
{{- end }}
{{- end }}
{{- end }}
