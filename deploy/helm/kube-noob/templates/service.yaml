apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-noob.fullname" . }}
  labels: {{- include "kube-noob.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "kube-noob.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP}
