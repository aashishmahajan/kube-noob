apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kube-noob.fullname" . }}-test-health
  # Deliberately NOT the selector labels: the Service, PDB and NetworkPolicy must not select this test pod.
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-test
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: health
      image: {{ include "kube-noob.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["python3", "-c"]
      args:
        - |
          import json, sys, urllib.request
          base = "http://{{ include "kube-noob.fullname" . }}:{{ .Values.service.port }}"
          ready = json.load(urllib.request.urlopen(base + "/readyz", timeout=20))
          print(ready)
          sys.exit(0 if ready.get("status") == "ready" and ready.get("knowledgeChunks", 0) > 0 else 1)
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities: {drop: [ALL]}
