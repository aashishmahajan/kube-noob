# kube-noob gate for GitLab CI: audit manifests, Containerfiles and image scanner reports before deploy, offline.
# Include it and extend the hidden job:
#   include:
#     - remote: https://raw.githubusercontent.com/aashishmahajan/kube-noob/<tag>/deploy/gitlab/kube-noob-gate.gitlab-ci.yml
#   kube-noob-gate:
#     extends: .kube-noob-gate
#     variables: {KUBE_NOOB_PATHS: "k8s", KUBE_NOOB_PLATFORM: openshift, KUBE_NOOB_VERSION: "4.20"}
# Findings show in the merge request (code quality report); SARIF and the Markdown summary are kept as artifacts.
.kube-noob-gate:
  stage: test
  image:
    name: ghcr.io/aashishmahajan/kube-noob:0.7.0
    entrypoint: [""]
  variables:
    KUBE_NOOB_PATHS: "."
    # PATH[=IMAGE][,context=DIR][,target=STAGE], separated by spaces (context: the Containerfile's directory)
    KUBE_NOOB_CONTAINERFILES: ""
    KUBE_NOOB_SCANNER_REPORTS: ""
    KUBE_NOOB_VEX: ""
    KUBE_NOOB_KEV: ""
    KUBE_NOOB_TRUST_REPORT_VEX: "false"
    KUBE_NOOB_SARIF_REPORTS: ""
    KUBE_NOOB_PLATFORM: kubernetes
    KUBE_NOOB_VERSION: ""
    KUBE_NOOB_EXCEPTIONS: ""
    KUBE_NOOB_FAIL_ON: high
    KUBE_NOOB_OFFLINE: "1"
  script:
    - |
      set -- --platform "$KUBE_NOOB_PLATFORM" --fail-on "$KUBE_NOOB_FAIL_ON"
      for p in $KUBE_NOOB_PATHS; do set -- "$@" -f "$p"; done
      for c in $KUBE_NOOB_CONTAINERFILES; do set -- "$@" --containerfile "$c"; done
      for r in $KUBE_NOOB_SCANNER_REPORTS; do set -- "$@" --scanner-report "$r"; done
      for x in $KUBE_NOOB_VEX; do set -- "$@" --vex "$x"; done
      if [ -n "$KUBE_NOOB_KEV" ]; then set -- "$@" --kev "$KUBE_NOOB_KEV"; fi
      if [ "$KUBE_NOOB_TRUST_REPORT_VEX" = "true" ]; then set -- "$@" --trust-report-vex; fi
      for s in $KUBE_NOOB_SARIF_REPORTS; do set -- "$@" --sarif-report "$s"; done
      if [ -n "$KUBE_NOOB_VERSION" ]; then set -- "$@" --version "$KUBE_NOOB_VERSION"; fi
      if [ -n "$KUBE_NOOB_EXCEPTIONS" ]; then set -- "$@" --exceptions "$KUBE_NOOB_EXCEPTIONS"; fi
      kube-noob gate "$@" --sarif kube-noob.sarif --summary kube-noob-summary.md \
        --codequality gl-code-quality-report.json --format text
  artifacts:
    when: always
    paths:
      - kube-noob.sarif
      - kube-noob-summary.md
    reports:
      codequality: gl-code-quality-report.json
