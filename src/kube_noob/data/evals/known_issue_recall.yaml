# Known-issue recall: questions as people ask them (prose), as alerts fire (alert), and as tools print them
# (events or log lines), each with the release-notes issue it should find. Negatives are everyday errors that must
# never pull in a bug. Written from the issue's symptom in our own words, then frozen: the matcher is tuned, never
# the questions. Gate (tests/test_known_issue_recall.py): recall >= 0.8, zero false matches.
