# A first attempt at exercise k8s-ex-hardened-deployment. Grade it, read the feedback, fix, resubmit.
# Try: kube-noob learn submit k8s-ex-hardened-deployment -f examples/exercise-answer.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: registry.example.com/web:1.4.2
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  selector: {app: web}
  ports:
    - port: 80
      targetPort: http
